  const esRef = useRef(null);
  const scanStartTsRef = useRef(null);
  const batchStartTsRef = useRef({});

  const fmtRel = (tsMs) => {
    if (!scanStartTsRef.current || !tsMs) return '';
    const s = Math.max(0, Math.round((tsMs - scanStartTsRef.current) / 1000));
    return `+${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  };

  // ── Load last job state from backend on mount ──────────────────────────────
  useEffect(() => {
    // 1. Check localStorage for a completed result saved this session
    try {
      const saved = localStorage.getItem("cs_last_result");
      if (saved) {
        const { result: savedResult, ts } = JSON.parse(saved);
        const ageHours = (Date.now() - ts) / 3600000;
        if (ageHours < 24 && savedResult) {
          setResult(savedResult);
          return;  // result restored — no need to show banner
        }
      }
    } catch(_) {}
    // 2. Fall back to jobs DB banner
    fetch(`${apiBase}/review/folder/jobs/latest`)
      .then(r => r.json())
      .then(d => { if (d.job) setLastJob(d.job); })
      .catch(() => {});
  }, []);

  // Auto-switch to Round 2 tab when Round 2 starts
  useEffect(() => {
    if (round2?.active) setFileTab("round2");
  }, [round2?.active]);

  const stopStream = () => {
    if (esRef.current) { esRef.current.close(); esRef.current = null; }
  };

  // ── Shared SSE connection logic ────────────────────────────────────────────
  const completedRef = useRef(false);  // prevents onerror from wiping state after complete

  const connectToStream = (job_id, initialProgress) => {
    completedRef.current = false;
    if (initialProgress) setProgress(initialProgress);
    const es = new EventSource(`${apiBase}/review/folder/stream/${job_id}`);
    esRef.current = es;

    es.onmessage = (e) => {
      let ev;
      try { ev = JSON.parse(e.data); } catch { return; }

      if (ev.event === "start") {
        const nowMs = Date.now();
        scanStartTsRef.current = nowMs;
        batchStartTsRef.current = {};
        setProgress(p => ({ 
          total: ev.total, current: p?.current || 0, currentFile: null, activeFiles: [], doneFiles: [],
          totalBatches: ev.total_batches || 1, batchSize: ev.batch_size || 0,
          currentBatch: p?.currentBatch || 1, batchStartIdx: p?.batchStartIdx || 1, filesInBatch: 0, 
          completedBatches: p?.completedBatches || [],
          startTime: p?.startTime || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
          startTsMs: nowMs,
        }));
        setRound2(null);
      } else if (ev.event === "sync_completed") {
        setProgress(p => p ? { ...p, doneFiles: ev.files } : p);
      } else if (ev.event === "sync_active") {
        setProgress(p => p ? { ...p, activeFiles: ev.activeFiles } : p);
      } else if (ev.event === "file_start") {
        setProgress(p => {
          if (!p) return p;
          const newActive = [...(p.activeFiles || []).filter(f => f.filename !== ev.file), { filename: ev.file, index: ev.index, batch: ev.batch || p.currentBatch }];
          return { ...p, current: Math.max(p.current, ev.index), activeFiles: newActive, currentFile: ev.file };
        });
      } else if (ev.event === "file_delayed") {
        // File pushed to Round 2 — add a pending yellow row
        setProgress(p => {
          if (!p) return p;
          const done = [...(p.doneFiles||[]), {
            filename: ev.file, issues: 0, score: null,
            delayed: true,
            batch: ev.batch || p.currentBatch,
            index: ev.index,
            timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
            size_bytes: ev.size_bytes
          }];
          const newActive = (p.activeFiles || []).filter(f => f.filename !== ev.file);
          return { ...p, current: Math.max(p.current, ev.index), currentFile: null, doneFiles: done, activeFiles: newActive };
        });
      } else if (ev.event === "batch_start") {
        batchStartTsRef.current[ev.batch] = Date.now();
        setProgress(p => p ? { ...p, currentBatch: ev.batch, batchStartIdx: ev.batch_start_idx, filesInBatch: ev.files_in_batch } : p);
      } else if (ev.event === "batch_done") {
        const nowMs = Date.now();
        const bStartMs = batchStartTsRef.current[ev.batch] || scanStartTsRef.current || nowMs;
        const durS = Math.round((nowMs - bStartMs) / 1000);
        const timeTaken = `${String(Math.floor(durS/60)).padStart(2,'0')}:${String(durS%60).padStart(2,'0')}`;
        setProgress(p => {
          if (!p) return p;
          const ts = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
          const completed = [...(p.completedBatches||[]), {
            batch: ev.batch, score: ev.score, issues: ev.issues,
            startIdx: ev.batch_start_idx, endIdx: ev.batch_end_idx, reportFile: ev.report_file, timestamp: ts,
            actualFiles: ev.files, timeTaken, endTsMs: nowMs, startTsMs: bStartMs,
          }];
          return { ...p, completedBatches: completed };
        });
      } else if (ev.event === "round2_start") {
        setRound2({ active: true, total: ev.total, done: 0 });
      } else if (ev.event === "file_done") {
        setRound2(r => r?.active ? { ...r, done: r.done + 1 } : r);
        setProgress(p => {
          if (!p) return p;
          const ts = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
          const existing = (p.doneFiles||[]).findIndex(f => f.filename === ev.file && f.delayed);
          
          const nowMs = Date.now();
          const newEntry = {
            filename: ev.file, issues: ev.issues ?? 0, score: ev.score,
            error: ev.summary?.startsWith("Error:") ? ev.summary : null,
            delayed: false, timestamp: ts, tsMs: nowMs,
            batch: ev.batch || (existing >= 0 ? p.doneFiles[existing].batch : p.currentBatch),
            round: existing >= 0 ? 2 : 1,
            index: ev.index,
            time_taken: ev.time_taken,
            size_bytes: ev.size_bytes
          };
          
          let done;
          if (existing >= 0) {
            done = [...p.doneFiles];
            done[existing] = newEntry;
          } else {
            done = [...(p.doneFiles||[]), newEntry];
          }
          const newActive = (p.activeFiles || []).filter(f => f.filename !== ev.file);
          return { ...p, current: Math.max(p.current, ev.index), currentFile: null, doneFiles: done, activeFiles: newActive };
        });
      } else if (ev.event === "complete") {
        const nowMs = Date.now();
        const durS = scanStartTsRef.current ? Math.round((nowMs - scanStartTsRef.current) / 1000) : 0;
        const totalTimeTaken = durS > 0 ? `${Math.floor(durS/60)}m ${durS%60}s` : "";
        completedRef.current = true;   // mark done BEFORE stopStream
        stopStream();
        setScanning(false);
        setPausing(false);
        // Keep progress but mark as complete
        setProgress(p => p ? { ...p, status: "complete", current: p.total, currentFile: null, totalTimeTaken } : null);
        setRound2(null);
        setResult(ev.result);
        // Persist to localStorage so reload doesn't lose it
        try {
          localStorage.setItem("cs_last_result", JSON.stringify({ result: ev.result, ts: Date.now() }));
        } catch(_) {}
        // Auto-download both txt and json
        try { downloadText(ev.result); } catch(_) {}
        setTimeout(() => {
          try { downloadJSON(ev.result); } catch(_) {}
        }, 800);
      } else if (ev.event === "paused") {
          completedRef.current = true;
          stopStream();
          setScanning(false);
          setPausing(false);
          setProgress(p => p ? { ...p, status: "paused", current: ev.index } : null);
      } else if (ev.event === "error") {
          completedRef.current = true;
          stopStream();
          setError(ev.detail);
          setScanning(false);
          setPausing(false);
          setProgress(null);
          setRound2(false);
      }
    };

    es.onerror = () => {
      if (completedRef.current) return;  // scan finished cleanly — ignore reconnect noise
      stopStream();
      setError("Connection to server lost. Check the backend is still running.");
      setScanning(false);
      setProgress(null);
    };
  };

  // ── Start a new scan ───────────────────────────────────────────────────────
  const submit = async () => {
    if (!path.trim()) return;
    setScanning(true); setResult(null); setError(null); setProgress(null); setLastJob(null);

    let job_id;
    try {
      const resp = await fetch(`${apiBase}/review/folder/start`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ folder_path: path, max_files: maxFiles, sleep_between_files: sleepSecs, context: ctx || null }),
      });
      if (!resp.ok) throw new Error(`${resp.status}: ${await resp.text()}`);
      ({ job_id } = await resp.json());
    } catch (e) {
      setError(e.message); setScanning(false); return;
    }

    connectToStream(job_id, null);
  };

  // ── Reconnect to an in-progress scan ──────────────────────────────────────
  const reconnectJob = (job) => {
    setLastJob(null);
    setScanning(true);
    setError(null);
    // Restore known progress count; new file_done events append from here
    connectToStream(job.job_id, {
      total: job.total_files,
      current: job.files_done,
      currentFile: null,
      doneFiles: [],
      resumedAt: job.files_done,
      completedBatches: [],
      startTime: job.start_time ? new Date(job.start_time * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : null,
    });
  };

  const pause = async () => {
    if (!progress || !scanning || pausing) return;
    setPausing(true);
    try {
      const jid = esRef.current?.url?.split('/').pop();
      if (!jid) { setPausing(false); return; }
      await fetch(`${apiBase}/review/folder/pause/${jid}`, { method: "POST" });
    } catch (e) { console.error("Pause failed", e); setPausing(false); }
  };

  const resume = async (job_id) => {
    setScanning(true);
    setError(null);
    setPausing(false);
    try {
      const resp = await fetch(`${apiBase}/review/folder/resume/${job_id}`, { method: "POST" });
      if (!resp.ok) throw new Error(await resp.text());
      const { job_id: jid } = await resp.json();
      connectToStream(jid, progress);
    } catch (e) { 
      let msg = e.message;
      if (e instanceof TypeError && e.message.includes("fetch")) {
        msg = "Backend unreachable. Please start the backend server and try again.";
      }
      setError(msg); 
      setScanning(false); 
      // If resume failed, restore the job banner so they can try again
      fetch(`${apiBase}/review/folder/jobs/latest`)
        .then(r => r.json())
        .then(d => { if (d.job) setLastJob(d.job); })
        .catch(() => {});
    }
  };

  const cancel = () => { stopStream(); setScanning(false); setProgress(null); setRound2(false); setPausing(false); };

  const pct = progress && progress.total > 0
    ? Math.round((progress.current / progress.total) * 100)
    : 0;

  const fmtAge = (ts) => {
    const mins = Math.round((Date.now()/1000 - ts) / 60);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    return `${Math.round(mins/60)}h ago`;
  };

  // ── Last-job banner (shown on load if no active scan) ─────────────────────
  const JobBanner = () => {
    if (!lastJob || scanning || result) return null;
    const folderName = (lastJob.folder_path||"").split(/[\\/]/).filter(Boolean).pop() || lastJob.folder_path;

    if (lastJob.status === "paused") {
      return (
        <div style={{background:"rgba(234,179,8,0.08)",border:"1px solid var(--medium)",borderRadius:8,padding:"14px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <span style={{fontSize:22}}>⏸️</span>
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>Scan paused — {fmtAge(lastJob.start_time)}</div>
            <div style={{color:"var(--text2)",fontSize:12,marginTop:2}}>
              <strong>{folderName}</strong> &nbsp;·&nbsp; {lastJob.files_done} / {lastJob.total_files} files done
            </div>
          </div>
          <button className="btn btn-primary" style={{fontSize:12,padding:"7px 16px"}} onClick={() => resume(lastJob.job_id)}>
            ▶ Resume
          </button>
          <button className="btn btn-ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={() => setLastJob(null)}>
            🔄 Start from Beginning
          </button>
          <button onClick={() => setLastJob(null)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text3)",fontSize:18,lineHeight:1}}>✕</button>
        </div>
      );
    }

    if (lastJob.status === "running") {
      return (
        <div style={{background:"rgba(99,102,241,0.08)",border:"1px solid var(--accent)",borderRadius:8,padding:"14px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <span style={{fontSize:22}}>🔄</span>
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>Scan in progress — {fmtAge(lastJob.start_time)}</div>
            <div style={{color:"var(--text2)",fontSize:12,marginTop:2}}>
              <strong>{folderName}</strong> &nbsp;·&nbsp; {lastJob.files_done} / {lastJob.total_files} files done
            </div>
          </div>
          <button className="btn btn-primary" style={{fontSize:12,padding:"7px 16px"}} onClick={() => reconnectJob(lastJob)}>
            ⚡ Reconnect
          </button>
          <button onClick={() => setLastJob(null)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text3)",fontSize:18,lineHeight:1}}>✕</button>
        </div>
      );
    }

    if (lastJob.status === "complete") {
      const score = lastJob.overall_score;
      const scoreCol = score == null ? "var(--text2)" : score >= 80 ? "var(--success)" : score >= 60 ? "var(--medium)" : "var(--critical)";
      return (
        <div style={{background:"rgba(22,163,74,0.06)",border:"1px solid rgba(22,163,74,0.4)",borderRadius:8,padding:"14px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <span style={{fontSize:22}}>✅</span>
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>Last scan complete — {fmtAge(lastJob.start_time)}</div>
            <div style={{color:"var(--text2)",fontSize:12,marginTop:2}}>
              <strong>{folderName}</strong> &nbsp;·&nbsp; {lastJob.files_done} files
              {score != null && <> &nbsp;·&nbsp; Score: <span style={{color:scoreCol,fontWeight:700}}>{score}/100</span></>}
              {lastJob.total_issues != null && <> &nbsp;·&nbsp; {lastJob.total_issues} issues</>}
              {lastJob.model_used && <> &nbsp;·&nbsp; {lastJob.model_used}</>}
            </div>
          </div>
          {lastJob.report_path && (
            <button className="btn btn-ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={() => {
              const fn = lastJob.report_path.split(/[\\/]/).pop();
              fetch(`${apiBase}/review/reports/${fn}`)
                .then(r => r.blob())
                .then(b => triggerDownload(b, fn))
                .catch(() => alert("Report file not found on server."));
            }}>
              ⬇ Download Report
            </button>
          )}
          <button onClick={() => setLastJob(null)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text3)",fontSize:18,lineHeight:1}}>✕</button>
        </div>
      );
    }

    if (lastJob.status === "error") {
      return (
        <div style={{background:"rgba(220,38,38,0.06)",border:"1px solid rgba(220,38,38,0.4)",borderRadius:8,padding:"14px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <span style={{fontSize:22}}>❌</span>
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>Last scan failed — {fmtAge(lastJob.start_time)}</div>
            <div style={{color:"var(--text2)",fontSize:12,marginTop:2}}>
              <strong>{folderName}</strong> &nbsp;·&nbsp; {lastJob.files_done}/{lastJob.total_files} files &nbsp;·&nbsp; {lastJob.error_detail || "Unknown error"}
            </div>
          </div>
          <button onClick={() => setLastJob(null)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text3)",fontSize:18,lineHeight:1}}>✕</button>
        </div>
      );
    }
    return null;
  };

  return (
    <div>
      <div className="page-title">Folder Scan</div>
      <div className="page-sub">Review an entire project folder — watch results stream in file by file.</div>

      <JobBanner />

      {(scanning || progress) && (
        (() => {
          if (!progress) return null;
          const doneList = progress.doneFiles || [];
          const activeList = progress.activeFiles || [];
          
          const r1Completed = doneList.filter(f => !f.delayed && f.round === 1).length;
          const r2Completed = doneList.filter(f => !f.delayed && f.round === 2).length;
          
          const r2Active = activeList.filter(a => doneList.some(d => d.filename === a.filename && d.delayed)).length;
          const r1Active = activeList.length - r2Active;
          
          const r2Pending = doneList.filter(f => f.delayed && !activeList.some(a => a.filename === f.filename)).length;
          const r1Pending = Math.max(0, progress.total - r1Completed - r1Active - r2Pending - r2Active - r2Completed);
          
          const totalCompleted = r1Completed + r2Completed;
          const totalActive = r1Active + r2Active;
          const totalPending = r1Pending + r2Pending;

          return (
            <div style={{ display: "flex", gap: "16px", marginBottom: "20px", flexWrap: "wrap" }}>
              <div style={{ flex: 1, background: "var(--surface)", border: "1px solid var(--success)", borderRadius: "var(--radius)", padding: "16px", textAlign: "center", boxShadow: "0 2px 8px rgba(34,197,94,0.1)", display: "flex", flexDirection: "column", justifyContent: "center" }}>
                <div style={{ fontSize: "28px", fontWeight: "700", color: "var(--success)", lineHeight: 1 }}>{totalCompleted}</div>
                <div style={{ fontSize: "12px", color: "var(--text2)", textTransform: "uppercase", fontWeight: "600", marginTop: "6px", letterSpacing: "0.5px" }}>Files Completed</div>
                <div style={{ fontSize: "11px", color: "var(--text3)", marginTop: "6px", fontWeight: "500" }}>R1: {r1Completed} &nbsp;·&nbsp; R2: {r2Completed}</div>
              </div>
              <div style={{ flex: 1, background: "var(--surface)", border: "1px solid var(--accent)", borderRadius: "var(--radius)", padding: "16px", textAlign: "center", boxShadow: "0 2px 8px rgba(99,102,241,0.1)", display: "flex", flexDirection: "column", justifyContent: "center" }}>
                <div style={{ fontSize: "28px", fontWeight: "700", color: "var(--accent)", lineHeight: 1 }}>{totalActive}</div>
                <div style={{ fontSize: "12px", color: "var(--text2)", textTransform: "uppercase", fontWeight: "600", marginTop: "6px", letterSpacing: "0.5px" }}>Files In-Process</div>
                <div style={{ fontSize: "11px", color: "var(--text3)", marginTop: "6px", fontWeight: "500" }}>R1: {r1Active} &nbsp;·&nbsp; R2: {r2Active}</div>
              </div>
              <div style={{ flex: 1, background: "var(--surface)", border: "1px solid var(--medium)", borderRadius: "var(--radius)", padding: "16px", textAlign: "center", boxShadow: "0 2px 8px rgba(234,179,8,0.1)", display: "flex", flexDirection: "column", justifyContent: "center" }}>
                <div style={{ fontSize: "28px", fontWeight: "700", color: "var(--medium)", lineHeight: 1 }}>{totalPending}</div>
                <div style={{ fontSize: "12px", color: "var(--text2)", textTransform: "uppercase", fontWeight: "600", marginTop: "6px", letterSpacing: "0.5px" }}>Files Pending</div>
                <div style={{ fontSize: "11px", color: "var(--text3)", marginTop: "6px", fontWeight: "500" }}>R1: {r1Pending} &nbsp;·&nbsp; R2: {r2Pending}</div>
              </div>
              {/* ETA bar — full width below the 3 cards */}
              {progress.status !== "complete" && (
                <div style={{ flexBasis: "100%", background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius)", padding: "12px 20px", display: "flex", gap: "32px", alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{ fontSize: "11px", color: "var(--text3)", textTransform: "uppercase", fontWeight: "700", letterSpacing: "0.6px", minWidth: 80 }}>⏱ Status</span>

                  {(() => {
                    if (!scanStartTsRef.current) return null;
                    const s = Math.floor((now - scanStartTsRef.current) / 1000);
                    const m = Math.floor(s / 60);
                    const h = Math.floor(m / 60);
                    const elapsedStr = h > 0 ? `${h}h ${m%60}m` : `${m}m ${s%60}s`;
                    return (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                        <div style={{ fontSize: "18px", fontWeight: "700", color: "var(--text)", lineHeight: 1 }}>{elapsedStr}</div>
                        <div style={{ fontSize: "10px", color: "var(--text3)", fontWeight: "600", textTransform: "uppercase", letterSpacing: "0.4px" }}>Elapsed</div>
                      </div>
                    );
                  })()}

                  <div style={{ width: 1, height: 36, background: "var(--border)" }} />

                  <span style={{ fontSize: "11px", color: "var(--text3)", textTransform: "uppercase", fontWeight: "700", letterSpacing: "0.6px", minWidth: 40, textAlign:"center" }}>ETA</span>

                  {(() => {
                    const r1Remaining = r1Pending;
                    const r1TotalLeft = r1Remaining + r1Active;
                    const concR1 = Math.max(1, r1Active || 1);
                    const r1Secs = Math.ceil(r1Remaining / concR1) * 60;
                    const r1m = Math.floor(r1Secs / 60);
                    const r1s = r1Secs % 60;
                    const r1Str = r1Remaining === 0 ? (r1Active > 0 ? "Finishing..." : "—")
                      : r1m >= 60 ? `${Math.floor(r1m/60)}h ${r1m%60}m`
                      : `${r1m}m ${r1s}s`;
                    return (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, opacity: r1TotalLeft === 0 ? 0.4 : 1 }}>
                        <div style={{ fontSize: "18px", fontWeight: "700", color: r1TotalLeft === 0 ? "var(--text3)" : "var(--accent2)", lineHeight: 1 }}>{r1Str}</div>
                        <div style={{ fontSize: "10px", color: "var(--text3)", fontWeight: "600", textTransform: "uppercase", letterSpacing: "0.4px" }}>R1 · {r1TotalLeft} left</div>
                      </div>
                    );
                  })()}

                  <div style={{ width: 1, height: 36, background: "var(--border)" }} />

                  {(() => {
                    const r2Remaining = r2Pending + r2Active;
                    const concR2 = Math.max(1, r2Active || 1);
                    const r2Secs = Math.ceil(r2Remaining / concR2) * 30 * 60;
                    const r2m = Math.floor(r2Secs / 60);
                    const r2Str = r2Remaining === 0 ? "—"
                      : r2m >= 60 ? `${Math.floor(r2m/60)}h ${r2m%60}m`
                      : `${r2m}m`;
                    const r2Note = r1Pending > 0 ? " (grows as R1 runs)" : "";
                    return (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, opacity: r2Remaining === 0 ? 0.4 : 1 }}>
                        <div style={{ fontSize: "18px", fontWeight: "700", color: r2Remaining === 0 ? "var(--text3)" : "#d97706", lineHeight: 1 }}>{r2Str}</div>
                        <div style={{ fontSize: "10px", color: "var(--text3)", fontWeight: "600", textTransform: "uppercase", letterSpacing: "0.4px" }}>R2 · {r2Remaining} files{r2Note}</div>
                      </div>
                    );
                  })()}

                  {progress.total > 0 && totalCompleted === progress.total && totalActive === 0 && (
                    <div style={{ marginLeft: "auto", color: "var(--success)", fontWeight: 700, fontSize: 13, animation: "ftpulse 1.5s infinite" }}>
                      ✨ Finalizing results...
                    </div>
                  )}

                  {!(totalCompleted === progress.total && totalActive === 0) && (
                    <div style={{ marginLeft: "auto", fontSize: "10px", color: "var(--text3)", fontStyle: "italic" }}>R1 ≈ 1 min/file · R2 ≈ 30 min/file</div>
                  )}
                </div>
              )}
            </div>
          );
        })()
      )}

      {error && <div className="error-box" style={{marginBottom:14}}>{error}</div>}

      {!scanning && !result && (
        <div className="card">
          <div className="form-group">
            <label>Absolute folder path (on the backend server)</label>
            <input type="text" value={path} onChange={e=>setPath(e.target.value)} placeholder="C:\projects\my-app" />
            
            {/* Custom Path Stats Display */}
            {path.trim() && (
              <div style={{ marginTop: 4, fontSize: 11, color: "var(--text3)" }}>
                {checkingCustomPath ? (
                  <span>⏳ Calculating files in path...</span>
                ) : customPathStats?.error ? (
                  <span style={{ color: "var(--critical)" }}>⚠️ Path not found or inaccessible on server</span>
                ) : customPathStats ? (
                  <span style={{ color: "var(--success)" }}>
                    ✓ Found <strong>{customPathStats.total_reviewable_files}</strong> reviewable files 
                    {customPathStats.skipped_size_limit > 0 && ` (skipped ${customPathStats.skipped_size_limit} >500KB)`}
                    {customPathStats.skipped_unknown_extension > 0 && ` (skipped ${customPathStats.skipped_unknown_extension} other files)`}
                  </span>
                ) : null}
              </div>
            )}

            <div style={{marginTop: 10}}>
              <label style={{fontSize: 11, fontWeight: 600, color: "var(--text2)", marginBottom: 6, display: "block"}}>Quick Scan Presets:</label>
              <div style={{display: "flex", flexWrap: "wrap", gap: 8}}>
                {PRESETS.map(preset => (
                  <button key={preset.id} type="button" className="btn btn-ghost"
                    style={{fontSize: 11, padding: "5px 10px", borderRadius: 4, background: "var(--surface2)", border: "1px solid var(--border)", cursor: "pointer"}}
                    onClick={() => { setPath(preset.path); setMax(9999); }}>
                    {getPresetLabel(preset)}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Max files to review</label>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="number" value={maxFiles === 9999 ? "" : maxFiles} onChange={e=>setMax(parseInt(e.target.value)||50)} min={1} max={9999} placeholder={maxFiles===9999?"All":""} style={{flex:1}} disabled={maxFiles===9999} />
                <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",marginBottom:0,whiteSpace:"nowrap"}}>
                  <input type="checkbox" checked={maxFiles===9999} onChange={e => setMax(e.target.checked ? 9999 : 50)} />
                  All files
                </label>
              </div>
            </div>
          </div>
          <div className="form-group">
            <label>Delay between files (seconds)</label>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="range" min={0} max={60} step={1} value={sleepSecs} onChange={e=>setSleep(parseInt(e.target.value))} style={{flex:1,accentColor:"var(--accent)"}} />
              <span style={{minWidth:32,textAlign:"right",fontSize:14,fontWeight:600,color:"var(--accent2)"}}>{sleepSecs}s</span>
            </div>
            <div style={{fontSize:11,color:"var(--text3)",marginTop:4}}>Higher = fewer rate limit errors. 0 = no delay (fast but may hit limits)</div>
          </div>
          <div className="form-group">
            <label>Optional context (what this project does)</label>
            <input type="text" value={ctx} onChange={e=>setCtx(e.target.value)} placeholder="e.g. Next.js SaaS campus placement platform" />
          </div>
          <button className="btn btn-primary" onClick={submit} disabled={!path.trim()}>
            Start Folder Scan
          </button>
        </div>
      )}

      {/* ── 4-tab file-list panel ─────────────────────────────────────────── */}
      {(scanning || progress) && progress && (() => {
        const doneList  = progress.doneFiles  || [];
        const activeList = progress.activeFiles || [];
        const r1Files   = doneList.filter(f => !f.delayed && f.round !== 2);
        const r2Done    = doneList.filter(f => !f.delayed && f.round === 2);
        const r2Pending = doneList.filter(f => f.delayed);
        const r2Total   = r2Done.length + r2Pending.length;

        const fileRow = (f, key) => (
          <div key={key} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 12px",background:"var(--surface)",borderRadius:6,marginBottom:4,fontSize:12}}>
            <span style={{color:"var(--text3)",fontSize:11,width:28,textAlign:"right",flexShrink:0}}>#{f.index||"?"}</span>
            <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--text2)"}}>
              {f.filename}
              {f.size_bytes != null && <span style={{marginLeft:6,color:"var(--text3)",fontSize:10}}>({f.size_bytes < 1024 ? f.size_bytes+" B" : (f.size_bytes/1024).toFixed(1)+" KB"})</span>}
            </span>
            <div style={{display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
              {f.error
                ? <span style={{color:"var(--critical)",fontSize:11,width:180,textAlign:"right"}}>Error</span>
                : <>
                    <span style={{width:55,textAlign:"right",color:scoreColor(f.score),fontWeight:700}}>{f.score != null ? `${f.score}/100` : "—"}</span>
                    <span style={{width:75,textAlign:"right",color:"var(--text2)"}}>{f.issues} issue{f.issues!==1?"s":""}</span>
                    <span style={{width:55,textAlign:"right",color:"var(--text3)",fontSize:10}}>
                      {f.time_taken != null ? `(${Math.floor(f.time_taken/60)}:${String(Math.round(f.time_taken%60)).padStart(2,'0')})` : ""}
                    </span>
                  </>
              }
              <span style={{color:"var(--text3)",fontSize:10,background:"rgba(0,0,0,0.04)",padding:"1px 5px",borderRadius:3,width:30,textAlign:"center"}}>B{f.batch||"?"}</span>
              <div style={{width:24,textAlign:"center"}}>
                {f.round===2
                  ? <span style={{color:"#d97706",fontSize:10,fontWeight:700,background:"rgba(245,158,11,0.1)",padding:"1px 4px",borderRadius:3}}>R2</span>
                  : <span style={{color:"#3b82f6",fontSize:10,fontWeight:700,background:"rgba(59,130,246,0.1)",padding:"1px 4px",borderRadius:3}}>R1</span>
                }
              </div>
              <span style={{color:"var(--text3)",fontSize:10,width:44,textAlign:"right"}}>{fmtRel(f.tsMs)}</span>
              <span style={{color:"var(--text3)",fontSize:10,width:52,textAlign:"right"}}>{f.timestamp||""}</span>
              <span style={{color:"var(--success)",fontSize:13,width:16,textAlign:"center"}}>✓</span>
            </div>
          </div>
        );

        return (
          <div style={{marginBottom:16}}>
            {/* Tab bar */}
            <div className="fltabs">
              <button className={`fltab${fileTab==="round1"?" flt-active":""}`} onClick={() => setFileTab("round1")}>
                ✅ Files Completed
                {r1Files.length > 0 && <span className="flt-badge">{r1Files.length}</span>}
              </button>
              <button className={`fltab${fileTab==="inprogress"?" flt-active":""}`} onClick={() => setFileTab("inprogress")}>
                ⚡ Files In-Process
                {activeList.length > 0 && <span className="flt-badge flt-badge-live">{activeList.length}</span>}
              </button>
              <button className={`fltab${fileTab==="round2"?" flt-active":""}`} onClick={() => setFileTab("round2")}>
                🔄 Round 2
                {r2Total > 0 && <span className={`flt-badge flt-badge-r2`}>{r2Total}</span>}
              </button>
              <button className={`fltab${fileTab==="batch"?" flt-active":""}`} onClick={() => setFileTab("batch")}>
                📦 Batch Info
                {(progress.completedBatches||[]).length > 0 && <span className="flt-badge">{(progress.completedBatches||[]).length}</span>}
              </button>
              <button className={`fltab${fileTab==="eventlog"?" flt-active":""}`} onClick={() => setFileTab("eventlog")}>
                📡 Live Event Log
                {eventLog.length > 0 && <span className="flt-badge" style={{background:"rgba(34,211,238,0.15)",color:"#22d3ee"}}>{eventLog.length}</span>}
              </button>
            </div>

            {/* ── Files Completed Tab (was Round 1) ── */}
            {fileTab === "round1" && (
              <div>
                {r1Files.length === 0
                  ? <div style={{textAlign:"center",padding:"32px 0",color:"var(--text3)",fontSize:13}}>
                      <div style={{fontSize:32,marginBottom:8}}>📋</div>
                      <div>No Round 1 files completed yet.</div>
                    </div>
                  : r1Files.map((f, i) => fileRow(f, `r1-${i}`))
                }
                {r2Pending.length > 0 && (
                  <div style={{marginTop:8,padding:"8px 14px",background:"rgba(245,158,11,0.06)",border:"1px dashed rgba(245,158,11,0.45)",borderRadius:6,fontSize:12,color:"#d97706",display:"flex",alignItems:"center",gap:8}}>
                    <span>⏳</span>
                    <span style={{fontWeight:600}}>{r2Pending.length} file{r2Pending.length!==1?"s":""} moved to Round 2</span>
                    <button onClick={() => setFileTab("round2")} style={{marginLeft:"auto",background:"none",border:"none",color:"#d97706",fontSize:11,cursor:"pointer",fontWeight:600}}>View Round 2 →</button>
                  </div>
                )}
              </div>
            )}

            {/* ── Round 2 Tab ── */}
            {fileTab === "round2" && (
              <div>
                {r2Total === 0
                  ? <div style={{textAlign:"center",padding:"32px 0",color:"var(--text3)",fontSize:13}}>
                      <div style={{fontSize:32,marginBottom:8}}>🔄</div>
                      <div>No files assigned to Round 2 yet.</div>
                      <div style={{fontSize:12,marginTop:4}}>Files exceeding Round 1 time limits will appear here.</div>
                    </div>
                  : (
                    <>
                      {/* Pending R2 queue */}
                      {r2Pending.length > 0 && (
                        <div style={{marginBottom:14}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,padding:"6px 12px",background:"rgba(245,158,11,0.1)",borderRadius:6}}>
                            <span style={{fontSize:14}}>⏳</span>
                            <span style={{fontWeight:700,fontSize:12,color:"#d97706"}}>Pending Queue — {r2Pending.length} file{r2Pending.length!==1?"s":""}</span>
                            {round2?.active && (
                              <span style={{fontSize:11,color:"var(--text3)",marginLeft:4}}>
                                · Total: {round2.total} &nbsp;·&nbsp;
                                <span style={{color:"var(--success)",fontWeight:700}}>Done: {round2.done}</span> &nbsp;·&nbsp;
                                <span style={{color:"var(--accent)",fontWeight:700}}>Left: {Math.max(0,round2.total-round2.done)}</span>
                              </span>
                            )}
                          </div>
                          {r2Pending.map((f, i) => (
                            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 12px",background:"rgba(245,158,11,0.04)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:6,marginBottom:4,fontSize:12}}>
                              <span style={{color:"var(--text3)",fontSize:11,minWidth:28}}>#{f.index||"?"}</span>
                              <span style={{color:"#d97706",fontSize:9,fontWeight:700,background:"rgba(245,158,11,0.15)",padding:"1px 4px",borderRadius:3,flexShrink:0}}>B{f.batch||"?"}</span>
                              <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#92400e"}}>{f.filename}</span>
                              {f.size_bytes != null && <span style={{color:"var(--text3)",fontSize:10}}>({f.size_bytes < 1024 ? f.size_bytes+" B" : (f.size_bytes/1024).toFixed(1)+" KB"})</span>}
                              <span style={{color:"#d97706",fontSize:10,fontWeight:700,animation:"ftpulse 1.4s ease-in-out infinite"}}>⏳ Pending</span>
                            </div>
                          ))}
                        </div>
                      )}
                      {/* R2 completed */}
                      {r2Done.length > 0 && (
                        <div>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,padding:"6px 12px",background:"rgba(22,163,74,0.07)",borderRadius:6}}>
                            <span style={{fontSize:14}}>✅</span>
                            <span style={{fontWeight:700,fontSize:12,color:"var(--success)"}}>Completed — {r2Done.length} file{r2Done.length!==1?"s":""}</span>
                            <span style={{fontSize:11,color:"var(--text3)",marginLeft:4}}>of {r2Total} total R2 files</span>
                          </div>
                          {r2Done.map((f, i) => fileRow(f, `r2d-${i}`))}
                        </div>
                      )}
                    </>
                  )
                }
              </div>
            )}

            {/* ── Batch Info Tab ── */}
            {fileTab === "batch" && (
              <div>
                {(!progress.completedBatches || progress.completedBatches.length === 0)
                  ? <div style={{textAlign:"center",padding:"32px 0",color:"var(--text3)",fontSize:13}}>
                      <div style={{fontSize:32,marginBottom:8}}>📦</div>
                      <div>No batches completed yet.</div>
                    </div>
                  : (
                    <>
                      {progress.startTime && (
                        <div style={{fontSize:11,color:"var(--text3)",marginBottom:10,textTransform:"uppercase",letterSpacing:0.5,fontWeight:600}}>
                          Scan Started at {progress.startTime}
                        </div>
                      )}
                      {progress.completedBatches.map((b, i) => {
                        const expectedCount = b.endIdx - b.startIdx + 1;
                        const r2Count = expectedCount - (b.actualFiles ?? expectedCount);
                        const relStart = fmtRel(b.startTsMs);
                        const relEnd   = fmtRel(b.endTsMs);
                        return (
                          <div key={i} style={{background:"rgba(22,163,74,0.07)",border:"1px solid rgba(22,163,74,0.3)",borderRadius:6,padding:"10px 14px",marginBottom:8,fontSize:13}}>
                            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                              <span>✅</span>
                              <span style={{fontWeight:700,color:"var(--success)"}}>Batch {b.batch} saved</span>
                              <span style={{color:"var(--text3)"}}>·</span>
                              <span style={{color:"var(--text2)"}}>Files {b.startIdx}–{b.endIdx}</span>
                              {r2Count > 0 && <span style={{color:"#d97706",fontSize:12}}>({b.actualFiles} R1 + <strong>{r2Count}</strong> → R2)</span>}
                              {r2Count === 0 && b.actualFiles != null && <span style={{color:"var(--text3)",fontSize:12}}>({b.actualFiles} files)</span>}
                              <span style={{color:"var(--text3)"}}>·</span>
                              {b.score != null && <span style={{color:scoreColor(b.score),fontWeight:600}}>{b.score}/100</span>}
                              <span style={{color:"var(--text2)"}}>{b.issues} issues</span>
                              {b.timeTaken && <span style={{color:"var(--accent2)",fontSize:12,fontWeight:600,background:"rgba(99,102,241,0.08)",padding:"2px 8px",borderRadius:4}}>⏱ {b.timeTaken}</span>}
                            </div>
                            <div style={{display:"flex",gap:12,marginTop:5,fontSize:11,color:"var(--text3)",flexWrap:"wrap"}}>
                              {relStart && <span>Started {relStart}</span>}
                              {relEnd   && <span>Finished {relEnd} · {b.timestamp}</span>}
                              {b.reportFile && <span style={{fontFamily:"monospace",marginLeft:"auto"}}>{b.reportFile}</span>}
                            </div>
                          </div>
                        );
                      })}
                    </>
                  )
                }
              </div>
            )}

            {/* ── Files In-Process Tab ── */}
            {fileTab === "inprogress" && (
              <div>
                {activeList.length === 0
                  ? <div style={{textAlign:"center",padding:"32px 0",color:"var(--text3)",fontSize:13}}>
                      <div style={{fontSize:32,marginBottom:8}}>⚡</div>
                      <div>{scanning ? "Waiting for files to start processing…" : "No active files."}</div>
                    </div>
                  : (
                    <div>
                      <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>
                        Concurrent Engine — {activeList.length} Thread{activeList.length!==1?"s":""} Active
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:4}}>
                        {activeList.map((f, i) => (
                          <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:"rgba(59,130,246,0.06)",border:"1px solid rgba(59,130,246,0.15)",borderRadius:6,fontSize:12}}>
                            <div style={{width:12,height:12,borderRadius:"50%",border:"2px solid #3b82f6",borderTopColor:"transparent",animation:"spin 1s linear infinite",flexShrink:0}} />
                            <span style={{color:"var(--text3)",fontSize:11,minWidth:25}}>#{f.index}</span>
                            <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--accent)",fontWeight:500}}>{f.filename}</span>
                            <span style={{color:"#3b82f6",fontSize:10,background:"rgba(59,130,246,0.1)",padding:"2px 6px",borderRadius:4,fontWeight:600}}>Active</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )
                }
              </div>
            )}

            {/* ── Live Event Log Tab — light theme ── */}
            {fileTab === "eventlog" && (
              <div style={{background:"var(--surface)",borderRadius:8,border:"1px solid var(--border)",overflow:"hidden"}}>
                {/* Header bar */}
                <div style={{background:"var(--surface2)",borderBottom:"1px solid var(--border)",padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:13}}>📡</span>
                  <span style={{fontSize:12,fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",color:"var(--text2)"}}>Live Event Log</span>
                  {scanning && <span style={{fontSize:10,color:"#0891b2",fontWeight:700,letterSpacing:"1px",marginLeft:"auto",animation:"ftpulse 1.6s ease-in-out infinite"}}>● LIVE</span>}
                  {eventLog.length > 0 && (
                    <button onClick={() => setEventLog([])} style={{background:"none",border:"1px solid var(--border)",borderRadius:4,color:"var(--text2)",fontSize:10,padding:"2px 8px",cursor:"pointer",marginLeft:scanning?"8px":"auto"}}>
                      Clear
                    </button>
                  )}
                </div>
                {/* Log rows */}
                <div style={{minHeight:120,maxHeight:420,overflowY:"auto",padding:"8px 0"}}>
                  {eventLog.length === 0
                    ? <div style={{textAlign:"center",padding:"40px 20px",color:"var(--text3)"}}>
                        <div style={{fontSize:28,marginBottom:8}}>📡</div>
                        <div style={{fontSize:13,color:"var(--text2)"}}>No events yet — events appear when providers rate-limit, error, or trigger fallbacks.</div>
                      </div>
                    : eventLog.map((ev, i) => (
                        <div key={i} style={{
                          display:"flex",alignItems:"center",gap:10,
                          padding:"5px 16px",
                          borderBottom:"1px solid var(--border)",
                          background: i % 2 === 0 ? "transparent" : "var(--surface2)"
                        }}>
                          <span style={{color:"var(--text3)",fontFamily:"monospace",fontSize:10,flexShrink:0,minWidth:64}}>{ev.ts}</span>
                          <span style={{
                            fontSize:10,fontWeight:800,padding:"2px 7px",borderRadius:4,flexShrink:0,
                            background:ev.bg,color:ev.color,minWidth:32,textAlign:"center"
                          }}>{ev.type}</span>
                          <span style={{fontWeight:700,color:"var(--text2)",fontSize:11,flexShrink:0,minWidth:64}}>{
                            {nvidia:"NVIDIA",deepseek:"DeepSeek",openai:"OpenAI",claude:"Claude",gemini:"Gemini"}[ev.provider]||ev.provider
                          }</span>
                          <span style={{fontSize:11,color:"var(--text)",flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.label}</span>
                        </div>
                      ))
                  }
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {/* DEAD CODE PLACEHOLDER — replaced by tab panel above */}
      {false && round2?.active && (
        <div style={{background:"rgba(245,158,11,0.12)",border:"1px solid rgba(245,158,11,0.5)",borderRadius:8,padding:"10px 16px",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:20}}>🔄</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13,color:"#d97706"}}>Round 2 in Progress</div>
              <div style={{fontSize:12,color:"var(--text2)",marginTop:2}}>
                Processing delayed files that took &gt; 3 min in Round 1.&nbsp;
                <strong style={{marginLeft:6}}>Total: {round2.total}</strong> &nbsp;·&nbsp;
                <strong style={{color:"var(--success)"}}>Done: {round2.done}</strong> &nbsp;·&nbsp;
                <strong style={{color:"var(--accent)"}}>Pending: {Math.max(0, round2.total - round2.done)}</strong>
              </div>
            </div>
          </div>
          {progress?.doneFiles?.filter(f => f.delayed).length > 0 && (() => {
              const r2pending = progress.doneFiles.filter(f => f.delayed);
              const maxConcurrent = 25; // matches max_concurrent_files config
              const actuallyRunning = Math.min(r2pending.length, maxConcurrent);
              return (
                <div style={{marginTop:8,borderTop:"1px solid rgba(245,158,11,0.2)",paddingTop:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{fontSize:10,fontWeight:700,color:"#d97706",textTransform:"uppercase",letterSpacing:0.5}}>
                      Delayed Queue — {r2pending.length} files
                    </span>
                    <span style={{fontSize:10,color:"var(--text3)"}}>
                      (up to {actuallyRunning} running concurrently)
                    </span>
                  </div>
                  <div style={{maxHeight:120,overflowY:"auto",display:"flex",flexDirection:"column",gap:2}}>
                    {r2pending.map((f, i) => (
                      <div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"3px 8px",background:"rgba(245,158,11,0.06)",borderRadius:4,fontSize:11}}>
                        <span style={{color:"var(--text3)",minWidth:22}}>#{f.index}</span>
                        <span style={{color:"#d97706",fontSize:9,fontWeight:700,background:"rgba(245,158,11,0.15)",padding:"1px 4px",borderRadius:3,flexShrink:0}}>B{f.batch||"?"}</span>
                        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#92400e"}}>{f.filename}</span>
                        <span style={{color:"#d97706",fontSize:9,fontWeight:700,flexShrink:0}}>⏳</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

        </div>
      )}

      {/* Progress bar */}
      {(scanning || progress) && (
        <div style={{marginBottom:16}}>
          <div style={{height:6,background:"var(--border)",borderRadius:3,overflow:"hidden",marginBottom:12}}>
            <div style={{height:"100%",width:`${pct}%`,background:progress?.status === "complete" ? "var(--success)" : progress?.status === "paused" ? "var(--medium)" : round2 ? "#f59e0b" : "var(--accent)",borderRadius:3,transition:"width 0.4s ease"}} />
          </div>
          {progress && (
            <div>
              {progress.totalBatches > 1 && (
                <div style={{fontSize:12,color:"var(--text2)",marginBottom:6,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",padding:"5px 10px",background:"rgba(99,102,241,0.06)",borderRadius:6}}>
                  <span>📦</span>
                  <strong style={{color:"var(--accent2)"}}>Batch {progress.currentBatch} of {progress.totalBatches}</strong>
                  <span style={{color:"var(--text3)"}}>·</span>
                  <span>Files {progress.batchStartIdx}–{Math.min((progress.batchStartIdx||1) + (progress.filesInBatch||progress.batchSize||25) - 1, progress.total)} of {progress.total}</span>
                  {progress.currentBatch > 1 && (
                    <span style={{color:"var(--success)",marginLeft:4}}>· {progress.currentBatch - 1} batch{progress.currentBatch - 1 > 1 ? "es" : ""} saved ✓</span>
                  )}
                </div>
              )}
              <div style={{fontSize:13,color:"var(--text2)",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span>
                  {progress.status === "complete"
                    ? <span style={{color:"var(--success)",fontWeight:700}}>✅ Scan Complete {progress.totalTimeTaken && <span style={{color:"var(--text3)", fontWeight: 500, marginLeft: 8}}>(Total Time: {progress.totalTimeTaken})</span>}</span>
                    : progress.status === "paused"
                      ? <span style={{color:"var(--medium)",fontWeight:700}}>⏸️ Scan Paused</span>
                      : pausing
                        ? <><span className="spinner" style={{marginRight:8,width:12,height:12}} /><span style={{color:"var(--medium)",fontWeight:600}}>Pausing after current file finishes…</span></>
                        : progress.resumedAt
                          ? <span>Reconnected — waiting for next file ({progress.resumedAt} already done)…</span>
                          : round2 && (!progress.activeFiles || progress.activeFiles.length === 0)
                            ? <span>⏳ Round 2 — waiting for slow AI responses…</span>
                            : <span>Running...</span>
                  }
                </span>
                <span style={{fontSize:12,color:"var(--text3)"}}>{progress.current} / {progress.total} files</span>
              </div>
              
            </div>
          )}
          <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
            {scanning && (
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-ghost" onClick={pause} disabled={pausing}
                  style={{fontSize:12,padding:"4px 12px",
                    borderColor: pausing ? "var(--text3)" : "var(--medium)",
                    color: pausing ? "var(--text3)" : "var(--medium)",
                    opacity: pausing ? 0.7 : 1,
                    cursor: pausing ? "not-allowed" : "pointer"}}>
                  {pausing
                    ? <><span className="spinner" style={{width:10,height:10,marginRight:5}} />Pausing...</>
                    : "⏸ Pause"}
                </button>
                <button className="btn-secondary" onClick={cancel} style={{fontSize:12,padding:"4px 12px"}}>
                  Cancel
                </button>
              </div>
            )}
            {!scanning && progress?.status === "paused" && (
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-primary" onClick={() => resume(progress.job_id || esRef.current?.url?.split('/').pop())} style={{fontSize:12,padding:"4px 12px"}}>
                  Resume
                </button>
                <button className="btn btn-ghost" onClick={() => setProgress(null)} style={{fontSize:12,padding:"4px 12px"}}>
                  Start from Beginning
                </button>
              </div>
            )}
            {progress && progress.current > 0 && (
              <button className="btn btn-ghost" style={{fontSize:12,padding:"4px 12px"}} title="Download the live report saved so far"
                onClick={() => {
                  fetch(`${apiBase}/review/folder/jobs/latest`)
                    .then(r => r.json())
                    .then(d => {
                      if (!d.job || !d.job.job_id) { alert("No live report available yet."); return; }
                      const fn = `codesentinel_${d.job.job_id.slice(0,8)}_live.txt`;
                      return fetch(`${apiBase}/review/reports/${fn}`)
                        .then(r => { if (!r.ok) throw new Error("not found"); return r.blob(); })
                        .then(b => triggerDownload(b, fn));
                    })
                    .catch(() => alert("Live report not available yet — wait for at least one file to complete."));
                }}>
                ⬇ Live TXT
              </button>
            )}
          </div>
        </div>
      )}

      {/* Batch completion cards and file list are now in the 4-tab panel above */}
      {false && progress?.completedBatches?.length > 0 && progress.totalBatches > 1 && (
        <div style={{marginBottom:12}}>
          {progress.startTime && (
            <div style={{fontSize:11,color:"var(--text3)",marginBottom:8,textTransform:"uppercase",letterSpacing:0.5,fontWeight:600}}>
              Scan Started at {progress.startTime}
            </div>
          )}
          {progress.completedBatches.map((b, i) => {
            const expectedCount = b.endIdx - b.startIdx + 1;
            const r2Count = expectedCount - (b.actualFiles ?? expectedCount);
            const relStart = fmtRel(b.startTsMs);
            const relEnd   = fmtRel(b.endTsMs);
            return (
              <div key={i} style={{background:"rgba(22,163,74,0.07)",border:"1px solid rgba(22,163,74,0.3)",borderRadius:6,padding:"8px 14px",marginBottom:6,fontSize:13}}>
                <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  <span>✅</span>
                  <span style={{fontWeight:700,color:"var(--success)"}}>Batch {b.batch} saved</span>
                  <span style={{color:"var(--text3)"}}>·</span>
                  <span style={{color:"var(--text2)"}}>Files {b.startIdx}–{b.endIdx}</span>
                  {r2Count > 0 && <span style={{color:"#d97706",fontSize:12}}>({b.actualFiles} R1 + <strong>{r2Count}</strong> → R2)</span>}
                  {r2Count === 0 && b.actualFiles != null && <span style={{color:"var(--text3)",fontSize:12}}>({b.actualFiles} files)</span>}
                  <span style={{color:"var(--text3)"}}>·</span>
                  {b.score != null && <span style={{color:scoreColor(b.score),fontWeight:600}}>{b.score}/100</span>}
                  <span style={{color:"var(--text2)"}}>{b.issues} issues</span>
                  {b.timeTaken && <span style={{color:"var(--accent2)",fontSize:12,fontWeight:600,background:"rgba(99,102,241,0.08)",padding:"2px 8px",borderRadius:4}}>⏱ {b.timeTaken}</span>}
                </div>
                <div style={{display:"flex",gap:12,marginTop:4,fontSize:11,color:"var(--text3)",flexWrap:"wrap"}}>
                  {relStart && <span>Started {relStart}</span>}
                  {relEnd   && <span>Finished {relEnd} · {b.timestamp}</span>}
                  {b.reportFile && <span style={{fontFamily:"monospace",marginLeft:"auto"}}>{b.reportFile}</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Files completed — superseded by 4-tab panel above */}
      {false && progress && progress.doneFiles.length > 0 && (() => {
        // Split: pending-delayed (shown as summary rows), r1 completed, r2 completed
        const r1Files    = progress.doneFiles.filter(f => !f.delayed && f.round !== 2);
        const r2Done     = progress.doneFiles.filter(f => !f.delayed && f.round === 2);
        const r2Pending  = progress.doneFiles.filter(f => f.delayed);

        // r2PendingByBatch: batch -> count (for summary rows in R1 list)
        const r2PendingByBatch = {};
        r2Pending.forEach(f => {
          const b = f.batch || '?';
          r2PendingByBatch[b] = (r2PendingByBatch[b] || 0) + 1;
        });

        // Build R1 display: files + R2-pending summary rows per batch
        const items = [];
        const batchesSeen = new Set();
        const batchLastIdx = {};
        r1Files.forEach((f, i) => { batchLastIdx[f.batch || 0] = i; });
        r1Files.forEach((f, i) => {
          items.push({ type: 'file', data: f });
          const b = f.batch || 0;
          if (i === batchLastIdx[b] && r2PendingByBatch[b]) {
            items.push({ type: 'r2summary', batch: b, count: r2PendingByBatch[b] });
            batchesSeen.add(b);
          }
        });
        Object.entries(r2PendingByBatch).forEach(([b, count]) => {
          if (!batchesSeen.has(Number(b)) && !batchesSeen.has(b))
            items.push({ type: 'r2summary', batch: b, count });
        });

        const fileRow = (f, key) => (
          <div key={key} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 12px",background:"var(--surface)",borderRadius:6,marginBottom:4,fontSize:12}}>
            <span style={{color:"var(--text3)",fontSize:11,minWidth:28}}>#{f.index||"?"}</span>
            <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--text2)"}}>
              {f.filename}
              {f.size_bytes != null && <span style={{marginLeft:6,color:"var(--text3)",fontSize:10}}>({f.size_bytes < 1024 ? f.size_bytes+" B" : (f.size_bytes/1024).toFixed(1)+" KB"})</span>}
            </span>
            {f.error
              ? <span style={{color:"var(--critical)",fontSize:11}}>Error</span>
              : <>
                  {f.score != null && <span style={{color:scoreColor(f.score),fontWeight:600,fontSize:12}}>{f.score}/100</span>}
                  <span style={{color:"var(--text2)"}}>{f.issues} issue{f.issues!==1?"s":""}</span>
                  {f.time_taken != null && <span style={{color:"var(--text3)",fontSize:10}}>({Math.floor(f.time_taken/60)}:{String(Math.round(f.time_taken%60)).padStart(2,"0")})</span>}
                </>
            }
            <span style={{color:"var(--text3)",fontSize:10,background:"rgba(0,0,0,0.04)",padding:"1px 5px",borderRadius:3}}>B{f.batch||"?"}</span>
            {f.round===2
              ? <span style={{color:"#d97706",fontSize:10,fontWeight:700,background:"rgba(245,158,11,0.1)",padding:"1px 5px",borderRadius:3}}>R2</span>
              : <span style={{color:"#3b82f6",fontSize:10,fontWeight:700,background:"rgba(59,130,246,0.1)",padding:"1px 5px",borderRadius:3}}>R1</span>
            }
            {f.tsMs && <span style={{color:"var(--text3)",fontSize:10,minWidth:44,textAlign:"right"}}>{fmtRel(f.tsMs)}</span>}
            <span style={{color:"var(--text3)",fontSize:10,minWidth:52,textAlign:"right"}}>{f.timestamp||""}</span>
            <span style={{color:"var(--success)",fontSize:13}}>✓</span>
          </div>
        );

        return (
          <div style={{marginBottom:16}}>
            {/* ── Round 1 files ── */}
            {items.map((item, i) => {
              if (item.type === 'r2summary') {
                return (
                  <div key={`r2s-${item.batch}`} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 12px",margin:"2px 0",background:"rgba(245,158,11,0.06)",border:"1px dashed rgba(245,158,11,0.4)",borderRadius:6,fontSize:11,color:"#d97706"}}>
                    <span>⏳</span>
                    <span style={{fontWeight:600}}>{item.count} file{item.count!==1?"s":""} from Batch {item.batch} → Round 2</span>
                    <span style={{marginLeft:"auto",fontSize:10,color:"var(--text3)"}}>results pending...</span>
                  </div>
                );
              }
              return fileRow(item.data, i);
            })}

            {/* ── Round 2 Results ── */}
            {r2Done.length > 0 && (
              <div style={{marginTop:12}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,padding:"6px 12px",background:"rgba(245,158,11,0.1)",borderRadius:6}}>

// ── Keys Status Tab ───────────────────────────────────────────────────────────
function KeysTab({ apiBase, active, eventLog, setEventLog }) {
  return (
    <div>
      <div className="page-title">Key Status</div>
      <div className="page-sub">Monitor AI provider availability, rate limits, cooldowns, and fallback triggers.</div>
      <div style={{ marginTop: 20 }}>
        <ProviderErrorPanel apiBase={apiBase} active={active} eventLog={eventLog} setEventLog={setEventLog} />
      </div>

      {/* Live Event Log */}
      <div className="card" style={{ marginTop: 20, padding: 0 }}>
        <div style={{background:"var(--surface2)",borderBottom:"1px solid var(--border)",padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:13}}>📡</span>
          <span style={{fontSize:12,fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",color:"var(--text2)"}}>Live Event Log</span>
          {active && <span style={{fontSize:10,color:"#0891b2",fontWeight:700,letterSpacing:"1px",marginLeft:"auto",animation:"ftpulse 1.6s ease-in-out infinite"}}>● LIVE</span>}
          {eventLog.length > 0 && (
            <button onClick={() => setEventLog([])} style={{background:"none",border:"1px solid var(--border)",borderRadius:4,color:"var(--text2)",fontSize:10,padding:"2px 8px",cursor:"pointer",marginLeft:active?"8px":"auto"}}>
              Clear
            </button>
          )}
        </div>
        <div style={{minHeight:120,maxHeight:420,overflowY:"auto",padding:"8px 0"}}>
          {eventLog.length === 0
            ? <div style={{textAlign:"center",padding:"40px 20px",color:"var(--text3)"}}>
                <div style={{fontSize:28,marginBottom:8}}>📡</div>
                <div style={{fontSize:13,color:"var(--text2)"}}>No events yet — events appear when providers rate-limit, error, or trigger fallbacks.</div>
              </div>
            : eventLog.map((ev, i) => (
                <div key={i} style={{
                  display:"flex",alignItems:"center",gap:10,
                  padding:"5px 16px",
                  borderBottom:"1px solid var(--border)",
                  background: i % 2 === 0 ? "transparent" : "var(--surface2)"
                }}>
                  <span style={{color:"var(--text3)",fontFamily:"monospace",fontSize:10,flexShrink:0,minWidth:64}}>{ev.ts}</span>
                  <span style={{
                    fontSize:10,fontWeight:800,padding:"2px 7px",borderRadius:4,flexShrink:0,
                    background:ev.bg,color:ev.color,minWidth:32,textAlign:"center"
                  }}>{ev.type}</span>
                  <span style={{fontWeight:700,color:"var(--text2)",fontSize:11,flexShrink:0,minWidth:64}}>{
                    {nvidia:"NVIDIA",deepseek:"DeepSeek",openai:"OpenAI",claude:"Claude",gemini:"Gemini"}[ev.provider]||ev.provider
                  }</span>
                  <span style={{fontSize:11,color:"var(--text)",flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.label}</span>
                </div>
              ))
          }
        </div>
      </div>
    </div>
  );
}

// ── App shell ─────────────────────────────────────────────────────────────────
const TABS = [
  { id: "snippet",  label: "Snippet" },
  { id: "upload",   label: "File Upload" },
  { id: "pr",       label: "GitHub PR" },
  { id: "folder",   label: "Folder Scan" },
  { id: "keys",     label: "Key Status" },
];

function App() {
  const [tab, setTab] = React.useState("snippet");
  const [health, setHealth] = React.useState(null);
  const [scanning, setScanning] = React.useState(false);
  const [eventLog, setEventLog] = React.useState([]);

  React.useEffect(() => {
    fetch(`${apiBase}/health`).then(r=>r.json()).then(d=>setHealth(d)).catch(()=>setHealth({status:"error"}));
  }, []);

  return (
    <div className="app">
      <div className="main">
        <div className="sidebar">
          <div style={{padding:"16px 20px",borderBottom:"1px solid var(--border)",marginBottom:8}}>
            <div style={{fontWeight:700,fontSize:16,letterSpacing:-0.3}}>Code<span style={{color:"var(--accent2)"}}>Sentinel</span></div>
            <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>AI Code Review</div>
          </div>
          <nav>
            {TABS.map(t => (
              <div key={t.id} className={`nav-item${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span>{t.label}</span>
                {t.id === "keys" && eventLog.length > 0 && (
                  <span className="flt-badge" style={{background:"rgba(245,158,11,0.15)",color:"#d97706",fontSize:9,padding:"1px 5px",borderRadius:4}}>
                    {eventLog.length}
                  </span>
                )}
                {t.id === "folder" && scanning && (
                  <span className="status-dot ok" style={{animation:"ftpulse 1.6s ease-in-out infinite",marginRight:0}} />
                )}
              </div>
            ))}
          </nav>
          <div style={{marginTop:"auto",padding:"12px 20px",borderTop:"1px solid var(--border)"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div className={`status-dot${health && health.status==="ok" ? " ok" : ""}`} />
              <span className="status-text">
                {health ? (health.status === "ok" ? `API online` : "API error") : "Connecting..."}
              </span>
            </div>
          </div>
        </div>{/* end sidebar */}

        <div className="content">
          <div style={{display:tab==="snippet"?"block":"none"}}><SnippetTab apiBase={apiBase} /></div>
          <div style={{display:tab==="upload"?"block":"none"}}><UploadTab apiBase={apiBase} /></div>
          <div style={{display:tab==="pr"?"block":"none"}}><PRTab apiBase={apiBase} /></div>
          <div style={{display:tab==="folder"?"block":"none"}}><FolderTab apiBase={apiBase} scanning={scanning} setScanning={setScanning} eventLog={eventLog} setEventLog={setEventLog} /></div>
          <div style={{display:tab==="keys"?"block":"none"}}><KeysTab apiBase={apiBase} active={tab === "keys" || scanning} eventLog={eventLog} setEventLog={setEventLog} /></div>
        </div>
      </div>
    </div>
  );
}

  const el = document.getElementById("root");

  if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
    el.innerHTML =
      "<div style=\"padding:28px;font-family:system-ui,sans-serif;max-width:520px;line-height:1.5\">" +
      "<h1 style=\"margin:0 0 12px\">CodeSentinel</h1>" +

      "</div>";
    return;
  }
  try {
    if (window.__INITIAL_DATA__) {
      const ReportView = () => (

          <div className="header">

            <div className="header-badge">Offline Report</div>
          </div>
          <div className="content" style={{maxWidth:"1200px", margin:"0 auto", flex:1, width:"100%"}}>
            <Results result={window.__INITIAL_DATA__} onClear={() => window.location.reload()} />
          </div>
        </div>
      );
      if (typeof ReactDOM.createRoot === "function") {
        ReactDOM.createRoot(el).render(<ReportView />);
      } else {
        ReactDOM.render(<ReportView />, el);
      }
      return;
    }

    if (typeof ReactDOM.createRoot === "function") {
      ReactDOM.createRoot(el).render(<App />);
    } else {
      ReactDOM.render(<App />, el);

  } catch (err) {
    console.error(err);
    el.innerHTML =
      "<div style=\"padding:28px;font-family:monospace;color:#b91c1c\">" +
      "<strong>UI failed to start</strong><pre style=\"margin-top:12px;white-space:pre-wrap\">" +
      String(err && err.message ? err.message : err) +

})();
