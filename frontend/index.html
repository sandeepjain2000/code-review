<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeSentinel — AI Code Review</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <!-- REPORT_DATA_INJECT -->
  <style>
    :root {
      --bg: #f8f9fc; --surface: #ffffff; --surface2: #f1f3f9;
      --border: #e2e6f0; --accent: #6366f1; --accent2: #4f46e5;
      --text: #1e2235; --text2: #64748b; --text3: #94a3b8;
      --critical: #dc2626; --high: #ea580c; --medium: #ca8a04; --low: #2563eb;
      --success: #16a34a; --radius: 8px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    a { color: var(--accent2); }

    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .header-logo span { color: var(--accent2); }
    .header-badge { background: var(--accent); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
    .header-server { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); }
    .status-dot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-text { font-size: 13px; color: var(--text2); }

    .main { display: flex; flex: 1; gap: 0; min-height: 100vh; }
    .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 0; flex-shrink: 0; display: flex; flex-direction: column; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; font-size: 14px; color: var(--text2); border-left: 3px solid transparent; transition: all 0.15s; }
    .nav-item:hover { color: var(--text); background: var(--surface2); }
    .nav-item.active { color: var(--accent2); border-left-color: var(--accent); background: rgba(99,102,241,0.08); }
    .nav-icon { font-size: 16px; }

    .content { flex: 1; padding: 28px; overflow-y: auto; }
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .page-sub { color: var(--text2); font-size: 14px; margin-bottom: 24px; }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 14px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 14px; }

    /* Form elements */
    label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
    input[type=text], input[type=number], textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 10px 12px; font-size: 14px; font-family: inherit;
      transition: border-color 0.15s; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 180px; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent2); }

    /* File drop zone */
    .dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; cursor: pointer; transition: all 0.15s; }
    .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(99,102,241,0.05); }
    .dropzone-icon { font-size: 32px; margin-bottom: 8px; }
    .dropzone-text { color: var(--text2); font-size: 14px; }

    /* Loading */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(99,102,241,0.25); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-bar { height: 3px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
    .loading-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); animation: loading 1.5s ease-in-out infinite; }
    @keyframes loading { 0% { width: 0%; margin-left: 0; } 50% { width: 70%; margin-left: 15%; } 100% { width: 0%; margin-left: 100%; } }

    /* Results */
    .results-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .score-circle { width: 72px; height: 72px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; border: 3px solid; }
    .score-number { font-size: 22px; line-height: 1; }
    .score-label { font-size: 10px; color: var(--text2); margin-top: 2px; }
    .results-meta { flex: 1; }
    .results-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .results-summary { color: var(--text2); font-size: 13px; line-height: 1.5; white-space: pre-wrap; font-family: 'Fira Code', 'Courier New', monospace; background: var(--surface2); padding: 16px; border-radius: 6px; border: 1px solid var(--border); margin-top: 12px; }

    /* Stats row */
    .stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; border: 1px solid; }
    .chip-critical { color: var(--critical); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.08); }
    .chip-high     { color: var(--high);     border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.08); }
    .chip-medium   { color: var(--medium);   border-color: rgba(234,179,8,0.3);  background: rgba(234,179,8,0.08);  }
    .chip-low      { color: var(--low);      border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.08); }

    /* File accordion */
    .file-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
    .file-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; user-select: none; }
    .file-header:hover { background: var(--surface2); }
    .file-name { font-family: monospace; font-size: 13px; font-weight: 600; flex: 1; }
    .file-badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
    .badge-red { background: rgba(239,68,68,0.15); color: var(--critical); }
    .badge-green { background: rgba(34,197,94,0.15); color: var(--success); }
    .file-score { font-size: 12px; color: var(--text2); }
    .file-chevron { color: var(--text3); transition: transform 0.2s; }
    .file-chevron.open { transform: rotate(90deg); }
    .file-issues { padding: 0 16px 16px; }

    /* Issue card */
    .issue-card { border-left: 3px solid; padding: 12px 14px; border-radius: 0 6px 6px 0; margin-bottom: 10px; background: var(--bg); }
    .issue-card.critical { border-color: var(--critical); }
    .issue-card.high     { border-color: var(--high); }
    .issue-card.medium   { border-color: var(--medium); }
    .issue-card.low      { border-color: var(--low); }
    .issue-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .issue-sev { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
    .sev-critical { background: rgba(239,68,68,0.2); color: var(--critical); }
    .sev-high     { background: rgba(249,115,22,0.2); color: var(--high); }
    .sev-medium   { background: rgba(234,179,8,0.2);  color: var(--medium); }
    .sev-low      { background: rgba(59,130,246,0.2); color: var(--low); }
    .issue-type { font-size: 11px; color: var(--text3); background: var(--surface2); padding: 2px 7px; border-radius: 4px; }
    .issue-line { font-size: 11px; color: var(--text3); font-family: monospace; }
    .issue-msg { font-size: 13px; line-height: 1.5; margin-bottom: 6px; }
    .issue-suggestion { font-size: 13px; color: var(--success); line-height: 1.5; }
    .issue-suggestion::before { content: "✓ "; }
    .code-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; font-family: monospace; font-size: 12px; margin-top: 8px; overflow-x: auto; white-space: pre; color: var(--text2); }

    /* Error / empty states */
    .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius); padding: 16px; color: var(--critical); font-size: 14px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 15px; }

    /* JSON viewer */
    .json-view { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; font-family: monospace; font-size: 12px; color: var(--text2); overflow: auto; max-height: 500px; white-space: pre; }

    /* Server config */
    .server-row { display: flex; align-items: center; gap: 10px; }
    .server-row input { flex: 1; }

    /* Inner file-list tabs */
    .fltabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 14px; margin-top: 8px; flex-wrap: wrap; }
    .fltab  { padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -2px; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; white-space: nowrap; }
    .fltab:hover { color: var(--text); background: var(--surface2); }
    .fltab.flt-active { color: var(--accent2); border-bottom-color: var(--accent); }
    .flt-badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: var(--surface2); color: var(--text2); }
    .flt-active .flt-badge { background: rgba(99,102,241,0.15); color: var(--accent2); }
    .flt-badge-r2 { background: rgba(245,158,11,0.15) !important; color: #d97706 !important; }
    .flt-badge-live { background: rgba(59,130,246,0.15) !important; color: #3b82f6 !important; animation: ftpulse 1.4s ease-in-out infinite; }
    @keyframes ftpulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

    /* Provider Error Summary Panel — light theme */
    .pep { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0; overflow: hidden; margin-bottom: 18px; box-shadow: var(--shadow); }
    .pep-header { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); }
    .pep-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); }
    .pep-live { font-size: 10px; color: #0891b2; font-weight: 700; letter-spacing: 1px; margin-left: auto; animation: ftpulse 1.6s ease-in-out infinite; }
    .pep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: var(--border); }
    .pep-cell { background: var(--surface); padding: 12px 14px; }
    .pep-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text2); margin-bottom: 6px; }
    .pep-state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
    .pep-closed   { color: var(--success); background: rgba(22,163,74,0.1); }
    .pep-open     { color: var(--critical); background: rgba(220,38,38,0.1); animation: ftpulse 1s ease-in-out infinite; }
    .pep-halfopen { color: var(--medium); background: rgba(202,138,4,0.1); }
    .pep-meta { font-size: 11px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
    .pep-meta span { color: var(--text); }
    .pep-bar-wrap { margin-top: 6px; height: 3px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
    .pep-bar { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
    .pep-errs { padding: 0 14px 10px; }
    .pep-err-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text2); }
    .pep-err-row:last-child { border-bottom: none; }
    .pep-err-code { font-weight: 700; padding: 1px 5px; border-radius: 4px; }
    .err-429 { color: #b45309; background: rgba(245,158,11,0.12); }
    .err-403 { color: var(--critical); background: rgba(220,38,38,0.1); }
    .err-other { color: var(--text2); background: var(--surface2); }
  </style>
</head>
<body>
<noscript><div style="padding:24px;font-family:sans-serif">JavaScript is required for CodeSentinel.</div></noscript>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/** API base: ?api=http://host:port override; else same origin when served at /ui from FastAPI; else localhost:8000 */
const apiBase = (() => {
  const q = new URLSearchParams(window.location.search).get("api");
  if (q) return q.replace(/\/$/, "");
  try {
    const { protocol, hostname, port, pathname } = window.location;
    if (protocol.startsWith("http") && port && (pathname === "/ui" || pathname.endsWith("/ui"))) {
      return `${protocol}//${hostname}:${port}`;
    }
  } catch (_) {}
  return "http://localhost:8000";
})();
const { useState, useEffect, useCallback, useRef } = React;

const API_BASE_DEFAULT = apiBase;

// ── Utility ──────────────────────────────────────────────────────────────────
const scoreColor = (s) => s >= 80 ? "#22c55e" : s >= 60 ? "#eab308" : s >= 40 ? "#f97316" : "#ef4444";
const sevClass   = (s) => ({ critical:"critical", high:"high", medium:"medium", low:"low" }[s] || "low");
const sevEmoji   = (s) => ({ critical:"🔴", high:"🟠", medium:"🟡", low:"🔵" }[s] || "⚪");

// ── Components ────────────────────────────────────────────────────────────────

function Header({ apiBase, status }) {
  return (
    <div className="header">
      <div className="header-logo">Code<span>Sentinel</span></div>
      <div className="header-badge">AI Review</div>
      <div className="header-server">
        <div className={`status-dot ${status}`} title={status === "ok" ? "Server connected" : "Server unreachable"} />
        <span className="status-text">{apiBase}</span>
      </div>
    </div>
  );
}

function Sidebar({ tab, setTab }) {
  const items = [
    { id: "snippet",  icon: "📝", label: "Code Snippet" },
    { id: "upload",   icon: "📁", label: "Upload Files" },
    { id: "pr",       icon: "🔀", label: "GitHub PR" },
    { id: "folder",   icon: "🗂️",  label: "Folder Scan" },
    { id: "settings", icon: "⚙️",  label: "Settings" },
  ];
  return (
    <div className="sidebar">
      {items.map(it => (
        <div key={it.id} className={`nav-item ${tab === it.id ? "active" : ""}`} onClick={() => setTab(it.id)}>
          <span className="nav-icon">{it.icon}</span>
          {it.label}
        </div>
      ))}
    </div>
  );
}

// ── Score circle ──────────────────────────────────────────────────────────────
function ScoreCircle({ score }) {
  if (score == null) return null;
  const color = scoreColor(score);
  return (
    <div className="score-circle" style={{ borderColor: color, color }}>
      <div className="score-number">{score}</div>
      <div className="score-label">/ 100</div>
    </div>
  );
}

// ── Issue card ────────────────────────────────────────────────────────────────
function IssueCard({ issue }) {
  const [open, setOpen] = useState(false);
  return (
    <div className={`issue-card ${sevClass(issue.severity)}`}>
      <div className="issue-top">
        <span className={`issue-sev sev-${sevClass(issue.severity)}`}>{issue.severity}</span>
        <span className="issue-type">{issue.type.replace(/_/g," ")}</span>
        {issue.line && <span className="issue-line">L{issue.line}{issue.line_end ? `–${issue.line_end}` : ""}</span>}
      </div>
      <div className="issue-msg">{issue.message}</div>
      {issue.suggestion && <div className="issue-suggestion">{issue.suggestion}</div>}
      {(issue.code_snippet || issue.fixed_snippet) && (
        <button className="btn btn-ghost" style={{fontSize:12,padding:"4px 10px",marginTop:8}} onClick={() => setOpen(o=>!o)}>
          {open ? "▲ Hide code" : "▼ Show code"}
        </button>
      )}
      {open && issue.code_snippet && (
        <div>
          <div style={{fontSize:11,color:"var(--text3)",marginTop:8}}>Problematic code:</div>
          <div className="code-block">{issue.code_snippet}</div>
        </div>
      )}
      {open && issue.fixed_snippet && (
        <div>
          <div style={{fontSize:11,color:"var(--success)",marginTop:8}}>Suggested fix:</div>
          <div className="code-block" style={{borderColor:"rgba(34,197,94,0.3)"}}>{issue.fixed_snippet}</div>
        </div>
      )}
    </div>
  );
}

// ── File accordion ────────────────────────────────────────────────────────────
function FileAccordion({ file }) {
  const [open, setOpen] = useState(file.issues?.length > 0);
  const count = file.issues?.length || 0;
  const hasBlock = file.issues?.some(i => ["critical","high"].includes(i.severity));
  return (
    <div className="file-block">

      <div className="file-header" onClick={() => setOpen(o=>!o)}>
        <span>📄</span>
        <span className="file-name">{file.filename}</span>
        <span className={`file-badge ${count > 0 ? "badge-red" : "badge-green"}`}>
          {count > 0 ? `${count} issue${count>1?"s":""}` : "✓ clean"}
        </span>
        {file.score != null && <span className="file-score" style={{color:scoreColor(file.score)}}>{file.score}/100</span>}
        {file.was_chunked && <span style={{fontSize:11,color:"var(--text3)"}}>chunked</span>}
        <span className={`file-chevron ${open?"open":""}`}>▶</span>
      </div>
      {open && (
        <div className="file-issues">
          {file.summary && <p style={{fontSize:13,color:"var(--text2)",marginBottom:12,lineHeight:1.5}}>{file.summary}</p>}
          {file.issues?.length === 0 && <div style={{color:"var(--success)",fontSize:13}}>✅ No issues found</div>}
          {file.issues?.map((issue, i) => <IssueCard key={i} issue={issue} />)}
          {file.test_cases?.length > 0 && (
            <div style={{marginTop: 16, background: "var(--bg1)", border: "1px solid var(--border)", borderRadius: 6, padding: "12px 16px"}}>
              <div style={{fontWeight: 600, fontSize: 13, marginBottom: 8, color: "var(--text)"}}>🧪 Test Coverage Generator</div>
              <ul style={{margin: 0, paddingLeft: 20, fontSize: 13, color: "var(--text2)", lineHeight: 1.5}}>
                {file.test_cases.map((tc, idx) => <li key={idx} style={{marginBottom: 4}}>{tc}</li>)}
              </ul>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Download helpers ──────────────────────────────────────────────────────────
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a   = document.createElement("a");
  a.href    = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  // Defer revocation so the browser has time to start the download
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 500);
}

function downloadJSON(result) {
  const blob = new Blob([JSON.stringify(result, null, 2)], { type: "application/json" });
  triggerDownload(blob, `codesentinel_${result.review_id?.slice(0,8) || "report"}.json`);
}

function buildTextReport(result) {
  const ts  = new Date().toLocaleString();
  const sev = result.issues_by_severity || {};
  const lines = [
    "=".repeat(65),
    "  CODESENTINEL — AI CODE REVIEW REPORT",
    "=".repeat(65),
    `  Generated : ${ts}`,
    `  Review ID : ${result.review_id}`,
    `  Model     : ${result.model_used}`,
    `  Score     : ${result.overall_score ?? "N/A"} / 100`,
    `  Files     : ${result.files?.length ?? 0}`,
    `  Issues    : ${result.total_issues}`,
  ];
  if (Object.keys(sev).length) {
    lines.push("");
    for (const s of ["critical","high","medium","low"]) {
      if (sev[s]) lines.push(`  ${s.toUpperCase().padEnd(10)} ${sev[s]}`);
    }
  }
  lines.push("", "-".repeat(65), "  SUMMARY", "-".repeat(65));
  lines.push(result.overall_summary || "No summary.");

  for (const file of result.files || []) {
    lines.push("", "=".repeat(65));
    lines.push(`  FILE: ${file.filename}`);
    lines.push(`  Score: ${file.score ?? "N/A"}/100   Issues: ${file.issues?.length ?? 0}`);
    if (file.summary) lines.push("", `  ${file.summary}`);
    for (const issue of file.issues || []) {
      lines.push("");
      lines.push(`  [${issue.severity.toUpperCase()}] ${issue.type.replace(/_/g," ")}${issue.line ? ` — Line ${issue.line}` : ""}`);
      lines.push(`  ${issue.message}`);
      if (issue.suggestion) lines.push(`  ✓ ${issue.suggestion}`);
      if (issue.code_snippet) lines.push(`  Problematic code:\n${issue.code_snippet.split("\n").map(l=>"    "+l).join("\n")}`);
      if (issue.fixed_snippet) lines.push(`  Suggested fix:\n${issue.fixed_snippet.split("\n").map(l=>"    "+l).join("\n")}`);
    }
  }
  lines.push("", "=".repeat(65), "  END OF REPORT", "=".repeat(65));
  return lines.join("\n");
}

function downloadText(result) {
  const blob = new Blob([buildTextReport(result)], { type: "text/plain" });
  triggerDownload(blob, `codesentinel_${result.review_id?.slice(0,8) || "report"}.txt`);
}

// ── Provider Error Summary Panel ──────────────────────────────────────────────
function ProviderErrorPanel({ apiBase, active, eventLog, setEventLog, staticData }) {
  const [health,   setHealth]   = useState(staticData || null);
  const pollRef  = useRef(null);
  const prevRef  = useRef({});  // previous snapshot to detect deltas

  const PROVIDER_ORDER = ["nvidia", "deepseek", "openai", "claude", "gemini"];
  const PROVIDER_LABEL = { nvidia:"NVIDIA", deepseek:"DeepSeek", openai:"OpenAI", claude:"Claude", gemini:"Gemini" };

  const fetchHealth = async () => {
    if (staticData) return;
    try {
      const r = await fetch(`${apiBase}/health/providers`);
      if (!r.ok) return;
      const { providers } = await r.json();
      const now = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});

      setEventLog(prev => {
        const next = [...prev];
        const allKeys = Object.keys(providers);
        for (const p of allKeys) {
          const cb  = (providers[p] || {}).circuit || {};
          const old = prevRef.current[p] || {};
          if ((cb.rate_limit_hits||0) > (old.rate_limit_hits||0)) {
            const d = (cb.rate_limit_hits||0)-(old.rate_limit_hits||0);
            next.unshift({ts:now,provider:p,type:"429",label:`Rate limited ×${d}`,color:"#f59e0b",bg:"rgba(245,158,11,0.13)"});
          }
          if ((cb.auth_errors||0) > (old.auth_errors||0)) {
            const d = (cb.auth_errors||0)-(old.auth_errors||0);
            next.unshift({ts:now,provider:p,type:"403",label:`Auth error ×${d} — check key/token`,color:"#ef4444",bg:"rgba(239,68,68,0.13)"});
          }
          if (cb.state==="open" && old.state!=="open") {
            next.unshift({ts:now,provider:p,type:"CB",label:`Circuit OPEN — provider skipped`,color:"#a78bfa",bg:"rgba(167,139,250,0.13)"});
          }
          if ((cb.fallback_uses||0) > (old.fallback_uses||0)) {
            const d = (cb.fallback_uses||0)-(old.fallback_uses||0);
            next.unshift({ts:now,provider:p,type:"FB",label:`Used as fallback ×${d}`,color:"#818cf8",bg:"rgba(99,102,241,0.13)"});
          }
        }
        prevRef.current = Object.fromEntries(allKeys.map(p => [p, (providers[p]||{}).circuit||{}]));
        return next.slice(0,30);
      });

      setHealth(providers);
    } catch(_) {}
  };

  useEffect(() => {
    if (staticData) { setHealth(staticData); return; }
    if (!active) { if (pollRef.current) clearInterval(pollRef.current); return; }
    fetchHealth();
    pollRef.current = setInterval(fetchHealth, 3000);
    return () => { if (pollRef.current) clearInterval(pollRef.current); };
  }, [active, staticData]);

  const providers  = health || {};
  const stateClass = s => s==="open" ? "pep-open" : s==="half-open" ? "pep-halfopen" : "pep-closed";
  const stateIcon  = s => s==="open" ? "🔴" : s==="half-open" ? "🟡" : "🟢";
  const rpmPct     = rl => !rl?.requests_limit ? 0 : Math.min(100,Math.round((rl.requests_used/rl.requests_limit)*100));
  const barColor   = p => p>=85?"#ef4444":p>=60?"#f59e0b":"#22c55e";

  return (
    <div className="pep">
      {/* Header */}
      <div className="pep-header">
        <span style={{fontSize:14}}>📡</span>
        <span className="pep-title">Provider Health Monitor</span>
        {active  && <span className="pep-live">● LIVE</span>}
        {!active && <span style={{fontSize:10,color:"var(--text3)",marginLeft:"auto"}}>Idle — polling starts when scan begins</span>}
      </div>

      {/* Per-provider grid */}
      <div className="pep-grid">
        {(() => {
          const keys = Object.keys(providers).sort((a,b) => {
            const order = ["nvidia", "deepseek", "openai", "claude", "gemini"];
            const idxA = order.findIndex(o => a === o || a.startsWith(o+":"));
            const idxB = order.findIndex(o => b === o || b.startsWith(o+":"));
            if (idxA !== idxB) return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
            return a.localeCompare(b);
          });

          return keys.map(p => {
            const info    = providers[p] || {};
            const cb      = info.circuit      || {state:"closed",failures:0,cooldown_remaining_seconds:0,rate_limit_hits:0,auth_errors:0,fallback_uses:0};
            const rl      = info.rate_limiter || {};
            const pct     = rpmPct(rl);
            
            let label = PROVIDER_LABEL[p] || p;
            if (p.startsWith("nvidia:")) label = `NVIDIA (${p.split(":")[1]})`;
            else if (p === "nvidia" && !providers[p]) return null; // skip base nvidia if we have specific keys
          const rl429   = cb.rate_limit_hits || 0;
          const auth403 = cb.auth_errors     || 0;
          const fbCount = cb.fallback_uses   || 0;
          const cooldown= cb.cooldown_remaining_seconds || 0;

          return (
            <div key={p} className="pep-cell">

              {/* Provider name + circuit state */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                <div className="pep-name">{label}</div>
                <span className={`pep-state ${stateClass(cb.state)}`} style={{fontSize:10}}>
                  {stateIcon(cb.state)} {cb.state.toUpperCase().replace("-","‑")}
                </span>
              </div>

              {/* ── 1. Rate Limiting (429) ── */}
              <div style={{marginBottom:7}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.3px",color:rl429>0?"#b45309":"var(--text3)"}}>
                    ⚡ Rate Limiting (429)
                  </span>
                  <span style={{
                    fontSize:11,fontWeight:800,padding:"1px 7px",borderRadius:99,
                    background:rl429>0?"rgba(245,158,11,0.15)":"var(--surface2)",
                    color:rl429>0?"#b45309":"var(--text3)"
                  }}>{rl429} hit{rl429!==1?"s":""}</span>
                </div>
                {rl.requests_limit > 0 ? (
                  <>
                    <div style={{fontSize:10,color:"var(--text2)",marginBottom:3}}>
                      RPM: <span style={{color:"var(--text)"}}>{rl.requests_used}/{rl.requests_limit}</span>
                      {pct>=80 && <span style={{color:"#b45309",marginLeft:6}}>⚠ Near limit</span>}
                    </div>
                    <div className="pep-bar-wrap">
                      <div className="pep-bar" style={{width:`${pct}%`,background:barColor(pct)}}/>
                    </div>
                  </>
                ) : (
                  <div style={{fontSize:10,color:"var(--text3)"}}>No requests recorded yet</div>
                )}
                {cb.state==="open" && cooldown>0 && (
                  <div style={{fontSize:10,color:"#b45309",marginTop:3}}>⏳ Cooldown: {Math.ceil(cooldown)}s remaining</div>
                )}
              </div>

              {/* ── 2. Auth Errors (403) ── */}
              <div style={{
                marginBottom:7,padding:"6px 8px",borderRadius:5,
                background:auth403>0?"rgba(220,38,38,0.06)":"transparent",
                border:`1px solid ${auth403>0?"rgba(220,38,38,0.2)":"var(--border)"}`
              }}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.3px",color:auth403>0?"var(--critical)":"var(--text3)"}}>
                    🔑 Auth Errors (403)
                  </span>
                  <span style={{
                    fontSize:11,fontWeight:800,padding:"1px 7px",borderRadius:99,
                    background:auth403>0?"rgba(220,38,38,0.12)":"var(--surface2)",
                    color:auth403>0?"var(--critical)":"var(--text3)"
                  }}>{auth403} error{auth403!==1?"s":""}</span>
                </div>
                {auth403>0 && (
                  <div style={{fontSize:10,color:"var(--critical)",marginTop:4,lineHeight:1.5}}>
                    ⚠ Check API key / token expiry
                  </div>
                )}
              </div>

              {/* ── 3. Fallback Dependency ── */}
              <div style={{
                padding:"6px 8px",borderRadius:5,
                background:fbCount>0?"rgba(99,102,241,0.06)":"transparent",
                border:`1px solid ${fbCount>0?"rgba(99,102,241,0.2)":"var(--border)"}`
              }}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.3px",color:fbCount>0?"var(--accent2)":"var(--text3)"}}>
                    🔀 Fallback Dependency
                  </span>
                  <span style={{
                    fontSize:11,fontWeight:800,padding:"1px 7px",borderRadius:99,
                    background:fbCount>0?"rgba(99,102,241,0.12)":"var(--surface2)",
                    color:fbCount>0?"var(--accent2)":"var(--text3)"
                  }}>{fbCount}×</span>
                </div>
                {fbCount>0 && (
                  <div style={{fontSize:10,color:"var(--accent2)",marginTop:4,lineHeight:1.4}}>
                    {label} used as fallback {fbCount} time{fbCount!==1?"s":""}
                    {fbCount>=5 && <span style={{color:"var(--accent)",marginLeft:4}}>— heavy reliance</span>}
                  </div>
                )}
              </div>

            </div>
          );
        })})()}
      </div>

    </div>
  );
}

function UploadTab({ apiBase }) {
  const [files, setFiles]   = useState([]);
  const [drag,  setDrag]    = useState(false);
  const [loading, setLoading] = useState(false);
  const [result, setResult]   = useState(null);
  const [error,  setError]    = useState(null);
  const inputRef = useRef();

  const onDrop = e => {
    e.preventDefault(); setDrag(false);
    setFiles([...files, ...Array.from(e.dataTransfer.files)]);
  };

  const submit = async () => {
    if (!files.length) return;
    setLoading(true); setResult(null); setError(null);
    const fd = new FormData();
    files.forEach(f => fd.append("files", f));
    try {
      const resp = await fetch(`${apiBase}/review/upload`, { method: "POST", body: fd });
      if (!resp.ok) throw new Error(`${resp.status}: ${await resp.text()}`);
      setResult(await resp.json());
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }

          <button className="btn btn-primary" onClick={submit} disabled={!files.length} style={{marginTop:14}}>
            <span>🔍</span> Review {files.length} File{files.length !== 1 ? "s" : ""}

  // ── Shared SSE connection logic ────────────────────────────────────────────
  const completedRef = useRef(false);  // prevents onerror from wiping state after complete

  const connectToStream = (job_id, initialProgress) => {
    completedRef.current = false;
    if (initialProgress) setProgress(initialProgress);
    const es = new EventSource(`${apiBase}/review/folder/stream/${job_id}`);
    esRef.current = es;

    es.onmessage = (e) => {
      let ev;
      try { ev = JSON.parse(e.data); } catch { return; }

      if (ev.event === "start") {
        const nowMs = Date.now();
        scanStartTsRef.current = nowMs;
        r2StartTsRef.current = null;
        batchStartTsRef.current = {};
        setProgress(p => ({ 
          total: ev.total, current: p?.current || 0, currentFile: null, activeFiles: [], doneFiles: [],
          totalBatches: ev.total_batches || 1, batchSize: ev.batch_size || 0,
          currentBatch: p?.currentBatch || 1, batchStartIdx: p?.batchStartIdx || 1, filesInBatch: 0, 
          completedBatches: p?.completedBatches || [],
          startTime: p?.startTime || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
          startTsMs: nowMs,
        }));
        setRound2(null);
      } else if (ev.event === "sync_completed") {
        setProgress(p => p ? { ...p, doneFiles: ev.files } : p);
      } else if (ev.event === "sync_active") {
        setProgress(p => p ? { ...p, activeFiles: ev.activeFiles } : p);
      } else if (ev.event === "file_start") {
        setProgress(p => {
          if (!p) return p;
          const newActive = [...(p.activeFiles || []).filter(f => f.filename !== ev.file), { filename: ev.file, index: ev.index, batch: ev.batch || p.currentBatch }];
          return { ...p, current: Math.max(p.current, ev.index), activeFiles: newActive, currentFile: ev.file };
        });
      } else if (ev.event === "file_delayed") {
        // File pushed to Round 2 — add a pending yellow row
        setProgress(p => {
          if (!p) return p;
          const done = [...(p.doneFiles||[]), {
            filename: ev.file, issues: 0, score: null,
            delayed: true,
            batch: ev.batch || p.currentBatch,
            index: ev.index,
            timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
            size_bytes: ev.size_bytes
          }];
          const newActive = (p.activeFiles || []).filter(f => f.filename !== ev.file);
          return { ...p, current: Math.max(p.current, ev.index), currentFile: null, doneFiles: done, activeFiles: newActive };
        });
      } else if (ev.event === "batch_start") {
        batchStartTsRef.current[ev.batch] = Date.now();
        setProgress(p => p ? { ...p, currentBatch: ev.batch, batchStartIdx: ev.batch_start_idx, filesInBatch: ev.files_in_batch } : p);
      } else if (ev.event === "batch_done") {
        const nowMs = Date.now();
        const bStartMs = batchStartTsRef.current[ev.batch] || scanStartTsRef.current || nowMs;
        const durS = Math.round((nowMs - bStartMs) / 1000);
        const timeTaken = `${String(Math.floor(durS/60)).padStart(2,'0')}:${String(durS%60).padStart(2,'0')}`;
        setProgress(p => {
          if (!p) return p;
          const ts = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
          const completed = [...(p.completedBatches||[]), {
            batch: ev.batch, score: ev.score, issues: ev.issues,
            startIdx: ev.batch_start_idx, endIdx: ev.batch_end_idx, reportFile: ev.report_file, timestamp: ts,
            actualFiles: ev.files, timeTaken, endTsMs: nowMs, startTsMs: bStartMs,
          }];
          return { ...p, completedBatches: completed };
        });
      } else if (ev.event === "round2_start") {
        setRound2({ active: true, total: ev.total, done: 0 });
        r2StartTsRef.current = Date.now();
      } else if (ev.event === "file_done") {
        setRound2(r => r?.active ? { ...r, done: r.done + 1 } : r);
        setProgress(p => {
          if (!p) return p;
          const ts = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
          const existing = (p.doneFiles||[]).findIndex(f => f.filename === ev.file && f.delayed);
          
          const nowMs = Date.now();
          const newEntry = {
            filename: ev.file, issues: ev.issues ?? 0, score: ev.score,
            error: ev.summary?.startsWith("Error:") ? ev.summary : null,
            delayed: false, timestamp: ts, tsMs: nowMs,
            batch: ev.batch || (existing >= 0 ? p.doneFiles[existing].batch : p.currentBatch),
            round: existing >= 0 ? 2 : 1,
            index: ev.index,
            time_taken: ev.time_taken,
            size_bytes: ev.size_bytes
          };
          
          let done;
          if (existing >= 0) {
            done = [...p.doneFiles];
            done[existing] = newEntry;
          } else {
            done = [...(p.doneFiles||[]), newEntry];
          }
          const newActive = (p.activeFiles || []).filter(f => f.filename !== ev.file);
          return { ...p, current: Math.max(p.current, ev.index), currentFile: null, doneFiles: done, activeFiles: newActive };
        });
      } else if (ev.event === "complete") {
        const nowMs = Date.now();
        const durS = scanStartTsRef.current ? Math.round((nowMs - scanStartTsRef.current) / 1000) : 0;
        const totalTimeTaken = durS > 0 ? `${Math.floor(durS/60)}m ${durS%60}s` : "";
        completedRef.current = true;   // mark done BEFORE stopStream
        stopStream();
        setScanning(false);
        setPausing(false);
        // Keep progress but mark as complete
        setProgress(p => p ? { ...p, status: "complete", current: p.total, currentFile: null, totalTimeTaken } : null);
        setRound2(null);
        setResult(ev.result);
        // Persist to localStorage so reload doesn't lose it
        try {
          localStorage.setItem("cs_last_result", JSON.stringify({ result: ev.result, ts: Date.now() }));
        } catch(_) {}
        // Auto-download both txt and json
        try { downloadText(ev.result); } catch(_) {}
        setTimeout(() => {
          try { downloadJSON(ev.result); } catch(_) {}
        }, 800);
      } else if (ev.event === "paused") {
          completedRef.current = true;
          stopStream();
          setScanning(false);
          setPausing(false);
          setProgress(p => p ? { ...p, status: "paused", current: ev.index } : null);
      } else if (ev.event === "error") {
          completedRef.current = true;
          stopStream();
          setError(ev.detail);
          setScanning(false);
          setPausing(false);
          setProgress(null);
          setRound2(false);
      }
    };

    es.onerror = () => {
      if (completedRef.current) return;  // scan finished cleanly — ignore reconnect noise
      stopStream();
      setError("Connection to server lost. Check the backend is still running.");
      setScanning(false);
      setProgress(null);
    };
  };

  // ── Start a new scan ───────────────────────────────────────────────────────
  const submit = async () => {

    scanStartTsRef.current = startMs;
    // Restore known progress count; new file_done events append from here
    connectToStream(job.job_id, {
      total: job.total_files,

      currentFile: null,

      resumedAt: job.files_done,

  const pct = progress && progress.total > 0
    ? Math.round((progress.current / progress.total) * 100)

  // ── Last-job banner (shown on load if no active scan) ─────────────────────
  const JobBanner = () => {

      return (

              {score != null && <> &nbsp;·&nbsp; Score: <span style={{color:scoreCol,fontWeight:700}}>{score}/100</span></>}

      );
    }

      return (
        <div style={{background:"rgba(220,38,38,0.06)",border:"1px solid rgba(220,38,38,0.4)",borderRadius:8,padding:"14px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>

            </div>

        </div>
      );
    }
    return null;
  };

  return (
    <div>
      <div className="page-title">Folder Scan</div>
      <div className="page-sub">Review an entire project folder — watch results stream in file by file.</div>

      <JobBanner />

      {(scanning || progress) && (
        (() => {
          if (!progress) return null;
          const doneList = progress.doneFiles || [];
          const activeList = progress.activeFiles || [];
          
          const r1Completed = doneList.filter(f => !f.delayed && f.round === 1).length;
          const r2Completed = doneList.filter(f => !f.delayed && f.round === 2).length;
          
          const r2Active = activeList.filter(a => doneList.some(d => d.filename === a.filename && d.delayed)).length;
          const r1Active = activeList.length - r2Active;
          
          const r2Pending = doneList.filter(f => f.delayed && !activeList.some(a => a.filename === f.filename)).length;
          const r1Pending = Math.max(0, progress.total - r1Completed - r1Active - r2Pending - r2Active - r2Completed);
          
          const totalCompleted = r1Completed + r2Completed;
          const totalActive = r1Active + r2Active;
          const totalPending = r1Pending + r2Pending;

          return (
            <div style={{ display: "flex", gap: "16px", marginBottom: "20px", flexWrap: "wrap" }}>
              <div style={{ flex: 1, background: "var(--surface)", border: "1px solid var(--success)", borderRadius: "var(--radius)", padding: "16px", textAlign: "center", boxShadow: "0 2px 8px rgba(34,197,94,0.1)", display: "flex", flexDirection: "column", justifyContent: "center" }}>
                <div style={{ fontSize: "28px", fontWeight: "700", color: "var(--success)", lineHeight: 1 }}>{totalCompleted}</div>

                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                        <div style={{ fontSize: "18px", fontWeight: "700", color: "var(--text)", lineHeight: 1 }}>{elapsedStr}</div>
                        <div style={{ fontSize: "10px", color: "var(--text3)", fontWeight: "600", textTransform: "uppercase", letterSpacing: "0.4px" }}>Elapsed</div>
                      </div>
                    );
                  })()}

                  <div style={{ width: 1, height: 36, background: "var(--border)" }} />

                  <span style={{ fontSize: "11px", color: "var(--text3)", textTransform: "uppercase", fontWeight: "700", letterSpacing: "0.6px", minWidth: 40, textAlign:"center" }}>ETA</span>

                  {(() => {
                    const r1Remaining = r1Pending;
                    const r1TotalLeft = r1Remaining + r1Active;
                    const concR1 = Math.max(1, r1Active || 1);
                    const r1Secs = Math.ceil(r1Remaining / concR1) * 60;
                    const r1m = Math.floor(r1Secs / 60);
                    const r1s = r1Secs % 60;
                    const r1Str = r1Remaining === 0 ? (r1Active > 0 ? "Finishing..." : "—")
                      : r1m >= 60 ? `${Math.floor(r1m/60)}h ${r1m%60}m`
                      : `${r1m}m ${r1s}s`;
                    return (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, opacity: r1TotalLeft === 0 ? 0.4 : 1 }}>
                        <div style={{ fontSize: "18px", fontWeight: "700", color: r1TotalLeft === 0 ? "var(--text3)" : "var(--accent2)", lineHeight: 1 }}>{r1Str}</div>
                        <div style={{ fontSize: "10px", color: "var(--text3)", fontWeight: "600", textTransform: "uppercase", letterSpacing: "0.4px" }}>R1 · {r1TotalLeft} left</div>
                      </div>
                    );
                  })()}

                  <div style={{ width: 1, height: 36, background: "var(--border)" }} />

                  {(() => {
                    const r2Remaining = r2Pending + r2Active;
                    const concR2 = Math.max(1, r2Active || 1);
                    const r2Secs = Math.ceil(r2Remaining / concR2) * 30 * 60;
                    const r2m = Math.floor(r2Secs / 60);
                    const r2Str = r2Remaining === 0 ? "—"
                      : r2m >= 60 ? `${Math.floor(r2m/60)}h ${r2m%60}m`
                      : `${r2m}m`;
                    const r2Note = r1Pending > 0 ? " (grows as R1 runs)" : "";
                    return (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, opacity: r2Remaining === 0 ? 0.4 : 1 }}>
                        <div style={{ fontSize: "18px", fontWeight: "700", color: r2Remaining === 0 ? "var(--text3)" : "#d97706", lineHeight: 1 }}>{r2Str}</div>
                        <div style={{ fontSize: "10px", color: "var(--text3)", fontWeight: "600", textTransform: "uppercase", letterSpacing: "0.4px" }}>R2 · {r2Remaining} files{r2Note}</div>
                      </div>
                    );
                  })()}

                  {progress.total > 0 && totalCompleted === progress.total && totalActive === 0 && (
                    <div style={{ marginLeft: "auto", color: "var(--success)", fontWeight: 700, fontSize: 13, animation: "ftpulse 1.5s infinite" }}>
                      ✨ Finalizing results...
                    </div>
                  )}

                  {!(totalCompleted === progress.total && totalActive === 0) && (
                    <div style={{ marginLeft: "auto", fontSize: "10px", color: "var(--text3)", fontStyle: "italic" }}>R1 ≈ 1 min/file · R2 ≈ 30 min/file</div>
                  )}
                </div>
              )}
            </div>
          );
        })()
      )}

      {error && <div className="error-box" style={{marginBottom:14}}>{error}</div>}

      {!scanning && !result && (
        <div className="card">
          <div className="form-group">
            <label>Absolute folder path (on the backend server)</label>
            <input type="text" value={path} onChange={e=>setPath(e.target.value)} placeholder="C:\projects\my-app" />
            
            {/* Custom Path Stats Display */}
            {path.trim() && (
              <div style={{ marginTop: 4, fontSize: 11, color: "var(--text3)" }}>
                {checkingCustomPath ? (
                  <span>⏳ Calculating files in path...</span>
                ) : customPathStats?.error ? (
                  <span style={{ color: "var(--critical)" }}>⚠️ Path not found or inaccessible on server</span>
                ) : customPathStats ? (
                  <span style={{ color: "var(--success)" }}>
                    ✓ Found <strong>{customPathStats.total_reviewable_files}</strong> reviewable files 
                    {customPathStats.skipped_size_limit > 0 && ` (skipped ${customPathStats.skipped_size_limit} >500KB)`}
                    {customPathStats.skipped_unknown_extension > 0 && ` (skipped ${customPathStats.skipped_unknown_extension} other files)`}
                  </span>
                ) : null}
              </div>
            )}

            <div style={{marginTop: 10}}>
              <label style={{fontSize: 11, fontWeight: 600, color: "var(--text2)", marginBottom: 6, display: "block"}}>Quick Scan Presets:</label>
              <div style={{display: "flex", flexWrap: "wrap", gap: 8}}>
                {PRESETS.map(preset => (
                  <button key={preset.id} type="button" className="btn btn-ghost"
                    style={{fontSize: 11, padding: "5px 10px", borderRadius: 4, background: "var(--surface2)", border: "1px solid var(--border)", cursor: "pointer"}}
                    onClick={() => { setPath(preset.path); setMax(9999); }}>
                    {getPresetLabel(preset)}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Max files to review</label>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="number" value={maxFiles === 9999 ? "" : maxFiles} onChange={e=>setMax(parseInt(e.target.value)||50)} min={1} max={9999} placeholder={maxFiles===9999?"All":""} style={{flex:1}} disabled={maxFiles===9999} />
                <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",marginBottom:0,whiteSpace:"nowrap"}}>
                  <input type="checkbox" checked={maxFiles===9999} onChange={e => setMax(e.target.checked ? 9999 : 50)} />
                  All files
                </label>
              </div>
            </div>
          </div>
          <div className="form-group">
            <label>Delay between files (seconds)</label>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="range" min={0} max={60} step={1} value={sleepSecs} onChange={e=>setSleep(parseInt(e.target.value))} style={{flex:1,accentColor:"var(--accent)"}} />
              <span style={{minWidth:32,textAlign:"right",fontSize:14,fontWeight:600,color:"var(--accent2)"}}>{sleepSecs}s</span>
            </div>
            <div style={{fontSize:11,color:"var(--text3)",marginTop:4}}>Higher = fewer rate limit errors. 0 = no delay (fast but may hit limits)</div>
          </div>
          <div className="form-group">
            <label>Optional context (what this project does)</label>
            <input type="text" value={ctx} onChange={e=>setCtx(e.target.value)} placeholder="e.g. Next.js SaaS campus placement platform" />
          </div>
          <button className="btn btn-primary" onClick={submit} disabled={!path.trim()}>
            Start Folder Scan
          </button>
        </div>
      )}

      {/* ── 5-tab file-list panel ─────────────────────────────────────────── */}
      {(scanning || progress) && progress && (() => {
        const doneList  = progress.doneFiles  || [];
        const activeList = progress.activeFiles || [];
        const r1Files   = doneList.filter(f => !f.delayed && f.round !== 2);
        const r2Done    = doneList.filter(f => !f.delayed && f.round === 2);
        
        const r2ActiveList = activeList.filter(a => doneList.some(d => d.filename === a.filename && d.delayed));
        const r1ActiveList = activeList.filter(a => !doneList.some(d => d.filename === a.filename && d.delayed));
        
        const r2Pending = doneList.filter(f => f.delayed && !activeList.some(a => a.filename === f.filename));

        const r1Completed = r1Files.length;
        const r2Completed = r2Done.length;
        const r1Active = r1ActiveList.length;
        const r2Active = r2ActiveList.length;
        
        const r2PendingCount = doneList.filter(f => f.delayed).length;
        const r1Pending = Math.max(0, progress.total - r1Completed - r1Active - r2PendingCount - r2Completed);
        const r2Total = r2Completed + r2PendingCount;

        const scanStart = scanStartTsRef.current;
        const r2Start = r2StartTsRef.current;

        const totalElapsedMs = scanStart ? now - scanStart : 0;
        const totalElapsedSecs = Math.floor(totalElapsedMs / 1000);
        
        const fmtDuration = (s) => {
          const hrs = Math.floor(s / 3600);
          const mins = Math.floor((s % 3600) / 60);
          const secs = s % 60;
          return hrs > 0 
            ? `${hrs}h ${mins}m ${secs}s` 
            : `${mins}m ${secs}s`;
        };

        let r1ElapsedSecs = 0;
        if (scanStart) {
          if (r2Start) {
            r1ElapsedSecs = Math.floor((r2Start - scanStart) / 1000);
          } else {
            r1ElapsedSecs = totalElapsedSecs;
          }
        }

        let r2ElapsedSecs = 0;
        if (r2Start) {
          r2ElapsedSecs = Math.floor((now - r2Start) / 1000);
        }

        const concR1 = Math.max(1, r1Active);
        const r1SecsLeft = r1Pending > 0 ? Math.ceil(r1Pending / concR1) * 60 : 0;
        const r1m = Math.floor(r1SecsLeft / 60);
        const r1s = r1SecsLeft % 60;
        const r1Str = r1Pending === 0 ? (r1Active > 0 ? "Finishing..." : "—")
          : r1m >= 60 ? `${Math.floor(r1m/60)}h ${r1m%60}m`
          : `${r1m}m ${r1s}s`;

        const concR2 = Math.max(1, r2Active);
        const r2SecsLeft = r2PendingCount > 0 ? Math.ceil(r2PendingCount / concR2) * 30 * 60 : 0;
        const r2m = Math.floor(r2SecsLeft / 60);
        const r2Str = r2PendingCount === 0 ? "—"
          : r2m >= 60 ? `${Math.floor(r2m/60)}h ${r2m%60}m`
          : `${r2m}m`;
          
        const totalSecsLeft = r1SecsLeft + r2SecsLeft;

        const fileRow = (f, key) => (
          <div key={key} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 12px",background:"var(--surface)",borderRadius:6,marginBottom:4,fontSize:12}}>
            <span style={{color:"var(--text3)",fontSize:11,width:28,textAlign:"right",flexShrink:0}}>#{f.index||"?"}</span>
            <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--text2)"}}>
              {f.filename}
              {f.size_bytes != null && <span style={{marginLeft:6,color:"var(--text3)",fontSize:10}}>({f.size_bytes < 1024 ? f.size_bytes+" B" : (f.size_bytes/1024).toFixed(1)+" KB"})</span>}
            </span>
            <div style={{display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
              {f.error
                ? <span style={{color:"var(--critical)",fontSize:11,width:180,textAlign:"right"}}>Error</span>
                : <>
                    <span style={{width:55,textAlign:"right",color:scoreColor(f.score),fontWeight:700}}>{f.score != null ? `${f.score}/100` : "—"}</span>
                    <span style={{width:75,textAlign:"right",color:"var(--text2)"}}>{f.issues} issue{f.issues!==1?"s":""}</span>
                    <span style={{width:55,textAlign:"right",color:"var(--text3)",fontSize:10}}>
                      {f.time_taken != null ? `(${Math.floor(f.time_taken/60)}:${String(Math.round(f.time_taken%60)).padStart(2,'0')})` : ""}
                    </span>
                  </>
              }
              <span style={{color:"var(--text3)",fontSize:10,background:"rgba(0,0,0,0.04)",padding:"1px 5px",borderRadius:3,width:30,textAlign:"center"}}>B{f.batch||"?"}</span>
              <div style={{width:24,textAlign:"center"}}>
                {f.round===2
                  ? <span style={{color:"#d97706",fontSize:10,fontWeight:700,background:"rgba(245,158,11,0.1)",padding:"1px 4px",borderRadius:3}}>R2</span>
                  : <span style={{color:"#3b82f6",fontSize:10,fontWeight:700,background:"rgba(59,130,246,0.1)",padding:"1px 4px",borderRadius:3}}>R1</span>
                }
              </div>
              <span style={{color:"var(--text3)",fontSize:10,width:44,textAlign:"right"}}>{fmtRel(f.tsMs)}</span>
              <span style={{color:"var(--text3)",fontSize:10,width:52,textAlign:"right"}}>{f.timestamp||""}</span>
              <span style={{color:"var(--success)",fontSize:13,width:16,textAlign:"center"}}>✓</span>
            </div>
          </div>
        );

        return (
          <div style={{marginBottom:16}}>
            {/* Tab bar */}
            <div className="fltabs">
              <button className={`fltab${fileTab==="round1"?" flt-active":""}`} onClick={() => setFileTab("round1")}>
                ✅ R1 Completed
                {r1Completed > 0 && <span className="flt-badge">{r1Completed}</span>}
              </button>
              <button className={`fltab${fileTab==="inprogress"?" flt-active":""}`} onClick={() => setFileTab("inprogress")}>
                ⚡ R1 In-Process
                {r1Active > 0 && <span className="flt-badge flt-badge-live">{r1Active}</span>}
              </button>
              <button className={`fltab${fileTab==="r2completed"?" flt-active":""}`} onClick={() => setFileTab("r2completed")}>
                🔄 R2 Completed
                {r2Completed > 0 && <span className="flt-badge">{r2Completed}</span>}
              </button>
              <button className={`fltab${fileTab==="r2inprogress"?" flt-active":""}`} onClick={() => setFileTab("r2inprogress")}>
                ⏳ R2 In-Process
                {r2PendingCount > 0 && <span className="flt-badge flt-badge-r2">{r2PendingCount}</span>}
              </button>
              <button className={`fltab${fileTab==="etc"?" flt-active":""}`} onClick={() => setFileTab("etc")}>
                ⏱️ ETC
              </button>
              <button className={`fltab${fileTab==="batch"?" flt-active":""}`} onClick={() => setFileTab("batch")}>
                📦 Batch Info
                {(progress.completedBatches||[]).length > 0 && <span className="flt-badge">{(progress.completedBatches||[]).length}</span>}
              </button>
              <button className={`fltab${fileTab==="eventlog"?" flt-active":""}`} onClick={() => setFileTab("eventlog")}>
                📡 Live Event Log
                {eventLog.length > 0 && <span className="flt-badge" style={{background:"rgba(34,211,238,0.15)",color:"#22d3ee"}}>{eventLog.length}</span>}
              </button>
            </div>

            {/* ── R1 Completed Tab ── */}
            {fileTab === "round1" && (
              <div>
                {r1Files.length === 0
                  ? <div style={{textAlign:"center",padding:"32px 0",color:"var(--text3)",fontSize:13}}>
                      <div style={{fontSize:32,marginBottom:8}}>📋</div>
                      <div>No Round 1 files completed yet.</div>
                    </div>
                  : r1Files.map((f, i) => fileRow(f, `r1-${i}`))
                }
                {r2PendingCount > 0 && (
                  <div style={{marginTop:8,padding:"8px 14px",background:"rgba(245,158,11,0.06)",border:"1px dashed rgba(245,158,11,0.45)",borderRadius:6,fontSize:12,color:"#d97706",display:"flex",alignItems:"center",gap:8}}>
                    <span>⏳</span>
                    <span style={{fontWeight:600}}>{r2PendingCount} file{r2PendingCount!==1?"s":""} moved to Round 2</span>
                    <button onClick={() => setFileTab("r2inprogress")} style={{marginLeft:"auto",background:"none",border:"none",color:"#d97706",fontSize:11,cursor:"pointer",fontWeight:600}}>View Round 2 →</button>
                  </div>
                )}
              </div>
            )}

            {/* ── R2 Completed Tab ── */}
            {fileTab === "r2completed" && (
              <div>
                {r2Completed === 0
                  ? <div style={{textAlign:"center",padding:"32px 0",color:"var(--text3)",fontSize:13}}>
                      <div style={{fontSize:32,marginBottom:8}}>🔄</div>
                      <div>No Round 2 files completed yet.</div>
                    </div>
                  : (
                    <div>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,padding:"6px 12px",background:"rgba(22,163,74,0.07)",borderRadius:6}}>
                        <span style={{fontSize:14}}>✅</span>
                        <span style={{fontWeight:700,fontSize:12,color:"var(--success)"}}>Completed R2 — {r2Completed} file{r2Completed!==1?"s":""}</span>
                      </div>
                      {r2Done.map((f, i) => fileRow(f, `r2d-${i}`))}
                    </div>
                  )
                }
              </div>
            )}

            {/* ── R2 In-Process Tab ── */}
            {fileTab === "r2inprogress" && (
              <div>
                {r2PendingCount === 0
                  ? <div style={{textAlign:"center",padding:"32px 0",color:"var(--text3)",fontSize:13}}>
                      <div style={{fontSize:32,marginBottom:8}}>⏳</div>
                      <div>No files assigned to Round 2 yet.</div>
                      <div style={{fontSize:12,marginTop:4}}>Files exceeding Round 1 time limits will appear here.</div>
                    </div>
                  : (
                    <div>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,padding:"6px 12px",background:"rgba(245,158,11,0.1)",borderRadius:6}}>
                        <span style={{fontSize:14}}>⏳</span>
                        <span style={{fontWeight:700,fontSize:12,color:"#d97706"}}>Round 2 Queue — {r2PendingCount} file{r2PendingCount!==1?"s":""}</span>
                        {round2?.active && (
                          <span style={{fontSize:11,color:"var(--text3)",marginLeft:4}}>
                            · Total: {round2.total} &nbsp;·&nbsp;
                            <span style={{color:"var(--success)",fontWeight:700}}>Done: {round2.done}</span> &nbsp;·&nbsp;
                            <span style={{color:"var(--accent)",fontWeight:700}}>Left: {Math.max(0,round2.total-round2.done)}</span>
                          </span>
                        )}
                      </div>
                      {/* List active files first, then pending files */}
                      {(() => {
                        const delayedList = doneList.filter(f => f.delayed);
                        return delayedList.map((f, i) => {
                          const isActive = activeList.some(a => a.filename === f.filename);
                          return (
                            <div key={i} style={{
                              display:"flex",alignItems:"center",gap:8,padding:"6px 12px",
                              background: isActive ? "rgba(59,130,246,0.06)" : "rgba(245,158,11,0.04)",
                              border: isActive ? "1px solid rgba(59,130,246,0.25)" : "1px solid rgba(245,158,11,0.2)",
                              borderRadius:6,marginBottom:4,fontSize:12
                            }}>
                              {isActive ? (
                                <div style={{width:12,height:12,borderRadius:"50%",border:"2px solid #3b82f6",borderTopColor:"transparent",animation:"spin 1s linear infinite",flexShrink:0}} />
                              ) : (
                                <span style={{color:"var(--text3)",fontSize:11,minWidth:12}}>#{f.index||"?"}</span>
                              )}
                              <span style={{color:"#d97706",fontSize:9,fontWeight:700,background:"rgba(245,158,11,0.15)",padding:"1px 4px",borderRadius:3,flexShrink:0}}>B{f.batch||"?"}</span>
                              <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color: isActive ? "var(--accent)" : "#92400e", fontWeight: isActive ? "600" : "normal"}}>{f.filename}</span>
                              {f.size_bytes != null && <span style={{color:"var(--text3)",fontSize:10}}>({f.size_bytes < 1024 ? f.size_bytes+" B" : (f.size_bytes/1024).toFixed(1)+" KB"})</span>}
                              {isActive ? (
                                <span style={{color:"#3b82f6",fontSize:10,fontWeight:600}}>⚡ Active</span>
                              ) : (
                                <span style={{color:"#d97706",fontSize:10,fontWeight:700,animation:"ftpulse 1.4s ease-in-out infinite"}}>⏳ Pending</span>
                              )}
                            </div>
                          );
                        });
                      })()}
                    </div>
                  )
                }
              </div>
            )}

            {/* ── ETC Tab ── */}
            {fileTab === "etc" && (
              <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius)", padding: "20px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "16px" }}>
                  <span style={{ fontSize: "18px" }}>⏱️</span>
                  <span style={{ fontSize: "12px", fontWeight: "800", textTransform: "uppercase", letterSpacing: "1px", color: "var(--text2)" }}>Execution Time & Estimates (ETC)</span>
                </div>
                
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "16px" }}>
                  
                  {/* R1 Timing Card */}
                  <div style={{ background: "rgba(99,102,241,0.03)", border: "1px solid rgba(99,102,241,0.12)", borderRadius: "8px", padding: "14px 16px" }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px", borderBottom: "1px solid rgba(99,102,241,0.08)", paddingBottom: "6px" }}>
                      <span style={{ fontWeight: "700", color: "var(--accent)", fontSize: "12px", letterSpacing: "0.5px" }}>ROUND 1 (R1)</span>
                      <span style={{ 
                        fontSize: "9px", fontWeight: "700", padding: "2px 6px", borderRadius: "99px",
                        background: r1Pending + r1Active > 0 ? "rgba(59,130,246,0.12)" : "rgba(34,197,94,0.12)",
                        color: r1Pending + r1Active > 0 ? "#2563eb" : "var(--success)",
                        textTransform: "uppercase"
                      }}>
                        {r1Pending + r1Active > 0 ? "Active" : "Completed"}
                      </span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px" }}>
                        <span style={{ color: "var(--text2)" }}>Time Elapsed:</span>
                        <strong style={{ color: "var(--text)" }}>{fmtDuration(r1ElapsedSecs)}</strong>
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px" }}>
                        <span style={{ color: "var(--text2)" }}>Time to Complete (ETC):</span>
                        <strong style={{ color: r1Pending > 0 ? "var(--accent2)" : "var(--text3)" }}>
                          {r1Pending > 0 ? r1Str : "—"}
                        </strong>
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "11px", color: "var(--text3)", borderTop: "1px dashed var(--border)", paddingTop: "6px", marginTop: "2px" }}>
                        <span>Files: {r1Completed} / {progress.total}</span>
                        <span>Active: {r1Active}</span>
                      </div>
                    </div>
                  </div>

                  {/* R2 Timing Card */}
                  <div style={{ background: "rgba(245,158,11,0.03)", border: "1px solid rgba(245,158,11,0.15)", borderRadius: "8px", padding: "14px 16px" }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px", borderBottom: "1px solid rgba(245,158,11,0.08)", paddingBottom: "6px" }}>
                      <span style={{ fontWeight: "700", color: "#d97706", fontSize: "12px", letterSpacing: "0.5px" }}>ROUND 2 (R2)</span>
                      <span style={{ 
                        fontSize: "9px", fontWeight: "700", padding: "2px 6px", borderRadius: "99px",
                        background: r2Start ? (r2PendingCount > 0 ? "rgba(245,158,11,0.15)" : "rgba(34,197,94,0.12)") : "var(--surface2)",
                        color: r2Start ? (r2PendingCount > 0 ? "#b45309" : "var(--success)") : "var(--text3)",
                        textTransform: "uppercase"
                      }}>
                        {r2Start ? (r2PendingCount > 0 ? "Active" : "Completed") : "Pending R1"}
                      </span>

            {/* ── Batch Info Tab ── */}
            {fileTab === "batch" && (

            {/* ── R1 In-Process Tab ── */}

                      Clear

                {/* Log rows */}

                        <div style={{fontSize:28,marginBottom:8}}>📡</div>

                      </div>
                    : eventLog.map((ev, i) => (
                        <div key={i} style={{

                          <span style={{
                            fontSize:10,fontWeight:800,padding:"2px 7px",borderRadius:4,flexShrink:0,
                            background:ev.bg,color:ev.color,minWidth:32,textAlign:"center"
                          }}>{ev.type}</span>
                          <span style={{fontWeight:700,color:"var(--text2)",fontSize:11,flexShrink:0,minWidth:64}}>{
                            {nvidia:"NVIDIA",deepseek:"DeepSeek",openai:"OpenAI",claude:"Claude",gemini:"Gemini"}[ev.provider]||ev.provider
                          }</span>
                          <span style={{fontSize:11,color:"var(--text)",flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.label}</span>
                        </div>
                      ))
                  }
                </div>
              </div>
            )}
          </div>

      })()}

      {/* DEAD CODE PLACEHOLDER — replaced by tab panel above */}
      {false && round2?.active && (
        <div style={{background:"rgba(245,158,11,0.12)",border:"1px solid rgba(245,158,11,0.5)",borderRadius:8,padding:"10px 16px",marginBottom:12}}>

            <span style={{fontSize:20}}>🔄</span>
            <div style={{flex:1}}>

                <strong style={{marginLeft:6}}>Total: {round2.total}</strong> &nbsp;·&nbsp;
                <strong style={{color:"var(--success)"}}>Done: {round2.done}</strong> &nbsp;·&nbsp;
                <strong style={{color:"var(--accent)"}}>Pending: {Math.max(0, round2.total - round2.done)}</strong>
              </div>
            </div>
          </div>

                      Delayed Queue — {r2pending.length} files
                    </span>
                    <span style={{fontSize:10,color:"var(--text3)"}}>
                      (up to {actuallyRunning} running concurrently)
                    </span>
                  </div>
                  <div style={{maxHeight:120,overflowY:"auto",display:"flex",flexDirection:"column",gap:2}}>
                    {r2pending.map((f, i) => (
                      <div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"3px 8px",background:"rgba(245,158,11,0.06)",borderRadius:4,fontSize:11}}>
                        <span style={{color:"var(--text3)",minWidth:22}}>#{f.index}</span>
                        <span style={{color:"#d97706",fontSize:9,fontWeight:700,background:"rgba(245,158,11,0.15)",padding:"1px 4px",borderRadius:3,flexShrink:0}}>B{f.batch||"?"}</span>
                        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#92400e"}}>{f.filename}</span>
                        <span style={{color:"#d97706",fontSize:9,fontWeight:700,flexShrink:0}}>⏳</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

        </div>
      )}

      {/* Progress bar */}
      {(scanning || progress) && (
        <div style={{marginBottom:16}}>
          <div style={{height:6,background:"var(--border)",borderRadius:3,overflow:"hidden",marginBottom:12}}>
            <div style={{height:"100%",width:`${pct}%`,background:progress?.status === "complete" ? "var(--success)" : progress?.status === "paused" ? "var(--medium)" : round2 ? "#f59e0b" : "var(--accent)",borderRadius:3,transition:"width 0.4s ease"}} />
          </div>
          {progress && (
            <div>
              {progress.totalBatches > 1 && (
                <div style={{fontSize:12,color:"var(--text2)",marginBottom:6,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",padding:"5px 10px",background:"rgba(99,102,241,0.06)",borderRadius:6}}>
                  <span>📦</span>
                  <strong style={{color:"var(--accent2)"}}>Batch {progress.currentBatch} of {progress.totalBatches}</strong>
                  <span style={{color:"var(--text3)"}}>·</span>
                  <span>Files {progress.batchStartIdx}–{Math.min((progress.batchStartIdx||1) + (progress.filesInBatch||progress.batchSize||25) - 1, progress.total)} of {progress.total}</span>
                  {progress.currentBatch > 1 && (
                    <span style={{color:"var(--success)",marginLeft:4}}>· {progress.currentBatch - 1} batch{progress.currentBatch - 1 > 1 ? "es" : ""} saved ✓</span>
                  )}
                </div>
              )}
              <div style={{fontSize:13,color:"var(--text2)",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span>
                  {progress.status === "complete"
                    ? <span style={{color:"var(--success)",fontWeight:700}}>✅ Scan Complete {progress.totalTimeTaken && <span style={{color:"var(--text3)", fontWeight: 500, marginLeft: 8}}>(Total Time: {progress.totalTimeTaken})</span>}</span>
                    : progress.status === "paused"
                      ? <span style={{color:"var(--medium)",fontWeight:700}}>⏸️ Scan Paused</span>
                      : pausing
                        ? <><span className="spinner" style={{marginRight:8,width:12,height:12}} /><span style={{color:"var(--medium)",fontWeight:600}}>Pausing after current file finishes…</span></>
                        : progress.resumedAt
                          ? <span>Reconnected — waiting for next file ({progress.resumedAt} already done)…</span>
                          : round2 && (!progress.activeFiles || progress.activeFiles.length === 0)
                            ? <span>⏳ Round 2 — waiting for slow AI responses…</span>
                            : <span>Running...</span>
                  }
                </span>
                <span style={{fontSize:12,color:"var(--text3)"}}>{progress.current} / {progress.total} files</span>
              </div>
              
            </div>
          )}
          <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
            {scanning && (
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-ghost" onClick={pause} disabled={pausing}
                  style={{fontSize:12,padding:"4px 12px",
                    borderColor: pausing ? "var(--text3)" : "var(--medium)",
                    color: pausing ? "var(--text3)" : "var(--medium)",
                    opacity: pausing ? 0.7 : 1,
                    cursor: pausing ? "not-allowed" : "pointer"}}>
                  {pausing
                    ? <><span className="spinner" style={{width:10,height:10,marginRight:5}} />Pausing...</>
                    : "⏸ Pause"}
                </button>
                <button className="btn-secondary" onClick={cancel} style={{fontSize:12,padding:"4px 12px"}}>
                  Cancel
                </button>
              </div>
            )}
            {!scanning && progress?.status === "paused" && (
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-primary" onClick={() => resume(progress.job_id || esRef.current?.url?.split('/').pop())} style={{fontSize:12,padding:"4px 12px"}}>
                  Resume
                </button>
                <button className="btn btn-ghost" onClick={() => setProgress(null)} style={{fontSize:12,padding:"4px 12px"}}>
                  Start from Beginning
                </button>
              </div>
            )}
            {progress && progress.current > 0 && (
              <button className="btn btn-ghost" style={{fontSize:12,padding:"4px 12px"}} title="Download the live report saved so far"
                onClick={() => {
                  fetch(`${apiBase}/review/folder/jobs/latest`)
                    .then(r => r.json())
                    .then(d => {
                      if (!d.job || !d.job.job_id) { alert("No live report available yet."); return; }
                      const fn = `codesentinel_${d.job.job_id.slice(0,8)}_live.txt`;
                      return fetch(`${apiBase}/review/reports/${fn}`)
                        .then(r => { if (!r.ok) throw new Error("not found"); return r.blob(); })
                        .then(b => triggerDownload(b, fn));
                    })
                    .catch(() => alert("Live report not available yet — wait for at least one file to complete."));
                }}>
                ⬇ Live TXT
              </button>
            )}
          </div>
        </div>

      {/* Batch completion cards and file list are now in the 4-tab panel above */}
      {false && progress?.completedBatches?.length > 0 && progress.totalBatches > 1 && (
        <div style={{marginBottom:12}}>
